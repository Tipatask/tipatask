<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TipΔTask — TODO</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/marked.min.js"></script>
<script>
  // Apply saved theme immediately to prevent flash
  (function() {
    // Keep in sync with DEFAULT_THEME / _THEME_ALIASES / _DARK_THEMES in task-board.js
    // (C1267, TPT220) and the static data-theme on <html> above — theme-default.test.js guards it.
    var DEFAULT = 'paper'; // TipATask dawn — what a profile with no stored preference paints
    var ALIASES = { '': DEFAULT, greenish: 'meadow', blueish: 'arctic', reddish: 'terracotta' };
    var DARK = { mocha: 1, ocean: 1, ember: 1, forest: 1, nord: 1, rose: 1, graphite: 1, espresso: 1, neon: 1, ink: 1 };
    var stored = '';
    try { stored = localStorage.getItem('tiptask-theme') || ''; } catch(e) {}
    var t = ALIASES[stored] || stored;
    if (t !== stored) {
      try { localStorage.setItem('tiptask-theme', t); } catch(e) {}
    }
    document.documentElement.setAttribute('data-theme', t);
    if (DARK[t]) document.documentElement.classList.add('theme-dark');
  })();
</script>
<link rel="stylesheet" href="/bundle.css">
</head>
<body>
<div class="container" id="app"></div>
<div id="task-edit-modal" hidden></div>

<div id="settings-modal" role="dialog" aria-modal="true" aria-label="Settings">
  <div class="settings-panel" role="document">
    <button class="settings-close" type="button" aria-label="Close settings">&times;</button>
    <h2 class="settings-title">Settings</h2>
    <div class="modal-tabs">
      <button class="modal-tab-btn active" type="button" data-tab="general">General</button>
      <button class="modal-tab-btn" type="button" data-tab="voice" id="settings-voice-tab-btn">Voice</button>

           its General/Voice siblings) since _populateSettingsWorkflowTab() only re-sets it
           on Settings-modal open; t() there overrides this for i18n. -->
      <button class="modal-tab-btn" type="button" data-tab="workflow" id="settings-workflow-tab-btn">Workflow</button>
      <!-- (C1490) Memory tab — Knowledge Base sync settings. Static label here (matching
           its siblings) since _populateSettingsMemoryTab() only re-sets it on Settings-
           modal open; t() there overrides this for i18n. -->
      <button class="modal-tab-btn" type="button" data-tab="memory" id="settings-memory-tab-btn">Memory</button>
      <!-- (TPT62) Version Control tab — git/svn/off + git-only worktree/commit/PR flags.
           Static label here (matching its siblings) since

            <option value="nord">Dark › Nordic Frost</option>
            <option value="rose">Dark › Rose Quartz</option>

         #settings-voice-local-list — the panel has no <form> ancestor, so radios still group

           list. Options are built entirely in JS (_populateVoiceInputDeviceSelect(),
           task-board.js) — device labels are arbitrary OS strings, and the row is hidden

      <label class="settings-row" id="settings-voice-input-device-row">

        <select id="settings-voice-input-device"></select>

      <label class="settings-row" id="settings-voice-shortcut-row">

      <div class="settings-wf-table" id="settings-workflow-list"></div>

         by _populateSettingsMemoryTab() in task-board.js. Web-app twin: tt-web-settings.md
         § Memory tab (C1489). See tt-knowledge-sync.md § Sync as you go (C1490). -->
    <div class="settings-body modal-tab-panel" data-tab="memory" hidden>
      <label class="settings-row" id="settings-kb-sync-row">
        <span id="settings-kb-sync-caption"></span>
        <input type="checkbox" id="settings-kb-sync-toggle">

    <!-- (TPT62) Version Control tab — vcs_type radio (git/svn/off) + the three git-only
         suboption checkboxes (worktree/commit/pr), hidden unless git is selected. Both
         lists are rendered from JS (VCS_TYPES/VCS_GIT_FLAGS in vcs-form.js) by

         server-rendered-once markup — same discipline as every other tab here. See
         tt-version-control-agents.md § Task App Settings UI. -->
    <div class="settings-body modal-tab-panel" data-tab="vcs" hidden>

      <div class="settings-vcs-suboptions" id="settings-vcs-git-options" hidden></div>
      <p class="settings-row-hint" id="settings-vcs-hint" hidden></p>
    </div>
  </div>
</div>

<script src="/bundle.js"></script>
<script>
// ── Import extracted modules from bundle ──
const { constants, state, utils, wsClient, objectiveTabs, subtaskCount, subtaskChain, taskCard, taskBoard, chatUI, chatTaskPreview } = window.TipTask;

// (C1462) Objective nav tab clicks — delegated once here (not rebound per render, like the
// other .nav-tabs handlers below) since #app itself is never replaced, only its innerHTML —
// this single listener survives every full render AND the out-of-band repaintObjectiveNavTabs()
// patch alike. Defined ahead of loadAndRender()/pushSubtaskCrumb() in source order, which is
// fine — neither is called until a real click happens, long after both exist.
// (C1463) Objective tab close — module-level so it survives every repaintObjectiveNavTabs()/
// loadAndRender() innerHTML replacement mid-await (a DOM-attached dataset.busy flag, the
// C1458 left-nav session-close idiom, would be wiped by exactly that repaint).
const _closingObjectiveTabs = new Set();

app.addEventListener('click', async (e) => {
  const closeBtn = e.target.closest('.nav-tab-objective-close[data-objective-close-key]');
  if (closeBtn) {
    e.stopPropagation();
    const parentKey = closeBtn.dataset.objectiveCloseKey;
    if (_closingObjectiveTabs.has(parentKey)) return;
    _closingObjectiveTabs.add(parentKey);
    try {
      // Two-phase: ask first (confirmed:false) whether every descendant is genuinely
      // closed — a fresh, unscoped, role-derived server check (ws-handlers.js), never the
      // client's own cosmetic tab tick (see objective-tabs.js's isObjectiveTabDone() doc
      // comment for why that source can't gate this decision).
      let res = await wsClient.terminateObjectiveSessions(parentKey, { confirmed: false });
      if (res.needsConfirm) {
        const ok = await showActionConfirm({
          message: t('nav.confirmCloseObjectiveTab', { key: escapeAttr(parentKey) }),
          confirmLabel: t('btn.close'),
          danger: true,
          overlayClass: 'modal-overlay--over-board',
        });
        if (!ok) return;
        res = await wsClient.terminateObjectiveSessions(parentKey, { confirmed: true });
      }
      if (!res.ok) {
        showToast(t('common.networkError', { msg: res.message || '' }), 'error');
        return;
      }
      for (const id of (res.taskIds || [])) forgetLocalSession(id);
      updateClaudeButtons();
      syncActiveSessionsNav();
      objectiveTabs.removeObjectiveTab(state.objectiveTabs, parentKey);
      // (TPT59) Membership, not activeObjectiveTabKey()/identity — subtaskStack is now the
      // full reconstructed ancestor chain, so closing the tab whose board is currently open
      // must match against ANY entry in the stack, not just the resolved "active tab" key.
      const wasActive = state.activeTab === 'board' && state.subtaskStack.some(e => e.taskKey === parentKey);
      if (wasActive) {
        // (C1463) Closing the tab you're currently drilled into exits to Project Board —
        // same exitSubtaskContextForTab() helper the top-nav Board/Backlog buttons use.
        exitSubtaskContextForTab('board');
        state.activeTab = 'board';
        loadAndRender({ scrollToTop: true });
      } else {
        repaintObjectiveNavTabs();
      }
    } finally {
      _closingObjectiveTabs.delete(parentKey);
    }
    return;
  }

  const btn = e.target.closest('.nav-tab-objective[data-objective-key]');
  if (!btn) return;
  const parentKey = btn.dataset.objectiveKey;
  // (TPT59) Compare the stack TOP, not stack[0]/length — subtaskStack is now the full
  // reconstructed ancestor chain, so a nested objective's own board can sit at any depth.
  const _navTop = state.subtaskStack[state.subtaskStack.length - 1];
  if (state.activeTab === 'board' && _navTop && _navTop.taskKey === parentKey) {
    window.scrollTo(0, 0);
    return;
  }
  const tab = state.objectiveTabs.find(x => x.parentKey === parentKey);
  // (C1461) subtaskParentTask cleared here, unlike .btn-open-subtask-board's append-only
  // push below — this jump can go straight from objective A's board to objective B's, and
  // a stale A pane must never render under B's breadcrumb while B's own parent fetch is
  // still in flight.
  state.subtaskStack = [];
  state.subtaskParentTask = null;
  utils.pushSubtaskCrumb(state.subtaskStack, { taskKey: parentKey, title: tab?.title || parentKey });
  state.activeTab = 'board';
  state.mobileMenuOpen = false;
  loadAndRender({ scrollToTop: true });
});

// (C1258) structuredClone() is a native deep-clone, materially faster than the
// JSON.parse(JSON.stringify()) round-trip below for a several-hundred-task array — this runs on
// EVERY board-task-cache read/write, including a plain cache-hit render (e.g. a left-nav
// Tasks<->Create switch). Every value passed through here is plain JSON-shaped data (task/sprint
// records, the {floor,has_older,extended} window object, the cache context) with no Dates/Maps/
// Sets/functions/circular refs, so the two are behaviorally equivalent. JSON fallback kept for
// any runtime where structuredClone is unavailable.
function _cloneBoardJson(value, fallback) {
  if (value === undefined || value === null) return fallback;
  if (typeof structuredClone === 'function') {
    try { return structuredClone(value); } catch { /* fall through to JSON clone below */ }
  }
  return JSON.parse(JSON.stringify(value));
}

function _stableSetValues(set) {
  return [...(set || new Set())].map(String).sort();
}

function _serializeTagDescriptions(map) {
  return [...(map || new Map()).entries()]
    .map(([name, description]) => [String(name), description || null])
    .sort(([a], [b]) => a.localeCompare(b));
}

// Fetch dimensions: project, subtask drill-down, sprint-window extension, People scope,
// and whether search must fetch past the active window's floor. Search text itself and
// tag/status/human/member filters stay client-side and do not change the task-list key.
// A full response has window:null, so retain its mode until search clears; otherwise
// the next render would revert to the smaller active window.
let _searchFullWindowActive = false;
function _boardTaskCacheContext() {
  const parentKey = state.subtaskStack.length > 0
    ? state.subtaskStack[state.subtaskStack.length - 1].taskKey
    : null;
  const searching = state.searchQuery.trim().length > 0;
  if (!searching) _searchFullWindowActive = false;
  return {
    project: window.electronAPI?.getProjectPath?.() || 'browser',
    parentKey,
    sprintWindowExtend: parentKey ? 0 : state.sprintWindowExtend,
    assigneeScope: state.assigneeScope || 'me',
    fullWindow: !parentKey && searching && (!!state.boardWindow?.has_older || _searchFullWindowActive),
  };
}

function _boardTaskFilterHash(context = _boardTaskCacheContext()) {
  const raw = JSON.stringify(context);
  let hash = 0;
  for (let i = 0; i < raw.length; i++) {
    hash = ((hash << 5) - hash + raw.charCodeAt(i)) | 0;
  }
  return `${raw.length}:${(hash >>> 0).toString(36)}`;
}

function _canUseBoardTaskCache() {
  return BOARD_TASK_CACHE_TABS.has(state.activeTab);
}

function _boardSnapshotFingerprint(snapshot) {
  const tagDescriptions = Array.isArray(snapshot.tagDescriptions)
    ? snapshot.tagDescriptions
    : _serializeTagDescriptions(snapshot.tagDescriptions);
  return JSON.stringify({
    tasks: snapshot.tasks || [],
    sprints: snapshot.sprints || [],
    tags: tagDescriptions,
    // (C1461) Parent detail pane reads the parent's title/status/tags/description
    // straight off this snapshot — without it in the fingerprint an edit to the parent
    // (no child change) would never trip refreshBoardSnapshotInBackground()'s diff, so a
    // cache-hit render would keep showing the stale pane indefinitely.

// snapshot must leave navigation unchanged.

  if (!top || parentTask.id !== top.taskKey) return;

  for (const entry of Array.isArray(ancestors) ? ancestors : []) {
    utils.pushSubtaskCrumb(rebuilt, entry);
  }
  utils.pushSubtaskCrumb(rebuilt, { taskKey: parentTask.id, title: parentTask.title });

    || rebuilt.some((e, i) => e.taskKey !== state.subtaskStack[i].taskKey);

  // cache-hit render (tab switch, filter toggle) doesn't blank the pane while a background

    tagDescriptions: _serializeTagDescriptions(snapshot.tagDescriptions || state.tagDescriptions),

// in the Map instead of clearing it. Zeroing `storedAt` defeats refreshBoardSnapshotInBackground()'s

    if (task.title !== undefined) state.taskTitleById.set(taskId, task.title || '');

  // stale — clear it. But a LIVE terminal session (process still running server-side, same

  // row visible, dimmed + ticked, until the user closes it — same behavior _loadAndRenderImpl

  // for closed tasks, never activeSessions). Deleting activeSessions here made the row vanish

  for (const [taskId, task] of updates) {

    if (!isLiveTerminal) {

function applyObjectiveTaskUpdate(task) {

async function fetchObjectiveTaskState() {

    return Array.isArray(result) ? result : (result?.tasks || []);
  }
  // (C1392) Was header-less — see api-client.js _http() for why this matters in browser mode.
  const res = await fetch('./api/project/tasks?_=' + Date.now(), { headers: projectHeader() });
  if (!res.ok) throw new Error(res.statusText || `HTTP ${res.status}`);
  const data = await res.json();

}

async function hydrateCurrentUser() {

    } else {
      // (C1392) Was header-less — see api-client.js _http() for why this matters in browser mode.

async function hydrateTagDescriptions() {

      return new Map((tags || []).map(t => [t.name, t.description || null]));

// (C1259) Root board fetch only. Returns { tasks, window } — window is the server's
// sprint-window info ({floor, has_older, extended}) or null (subtask drill-down doesn't
// window; file backend that can't compute one also returns null, never fails).
// extendSprints widens the floor for "Load More" — see fetchBoardSnapshot() below.
// (C1407) unscoped: true — People-filter "All Tasks" mode. Threaded into BOTH the root
// board fetch and the parentKey (subtask drill-down) fetch, so drill-down obeys the same
// filter the board does. false/omitted keeps today's My-Tasks-scoped behavior.
async function fetchBoardWindow(parentKey, extendSprints, unscoped = false, fullWindow = false) {
  if (window.electronAPI?.api) {
    // Electron IPC path — per-window backend, no fetch
    if (parentKey) return { tasks: await window.electronAPI.api.tasks.children(parentKey, { unscoped }), window: null };
    return window.electronAPI.api.tasks.board({ extendSprints, unscoped, fullWindow });
  }

  let url = './TODO.md?_=' + Date.now();
  if (parentKey) {
    url += '&parentKey=' + encodeURIComponent(parentKey);
  } else if (fullWindow) {
    url += '&full_window=true';
  } else {
    url += '&window=active';
    if (extendSprints > 0) url += '&extend_sprints=' + extendSprints;
  }
  if (unscoped) url += '&assignees=all';

  // board (renderTaskLoadError). See api-client.js _http() / ai/architecture/tt-task-board.md.
  const res = await fetch(url, { headers: projectHeader() });
  if (!res.ok) throw new Error(res.statusText);

  if (!match) return { tasks: [], window: null };

    tasks: parsed && Array.isArray(parsed.tasks) ? parsed.tasks : [],
    window: (parsed && parsed.window) || null,
  };
}

async function hydrateSprints() {
  // Fetch sprint records from API so we can show all sprint containers (including empty future sprints).
  if (window.electronAPI?.api?.sprints?.list) {
    try {
      const fetched = await window.electronAPI.api.sprints.list();
      if (Array.isArray(fetched) && fetched.length > 0) return fetched;
    } catch { /* non-fatal — fall back to task-derived tiers */ }

}

// resolve the breadcrumb ancestor chain below (dbId/parentDbId lookup, see subtask-chain.js).
// Without the TTL, drilling into a nested board would pay a *second* serial round trip that

async function fetchBoardSnapshot(context = _boardTaskCacheContext()) {
  // hydrateCurrentUser() is memoized after the first call (early-return on _currentUser)
  // — kept first because getBoardTasks()'s assignee scoping needs it, but it never adds
  // a real round-trip past the first render. The independent fetches below used to
  // run as serial awaits (user → tags → tasks → sprints); tags/tasks/sprints/parent don't
  // depend on each other, so they run concurrently now.

  // above) never returns the parent row itself, so fetch it separately, off the critical
  // path for the root board (conditional on parentKey). A failed/missing parent must never
  // break the board — swallow to null; renderParentTaskPane() has its own degraded path
  // (stack-top taskKey/title only) for exactly this case.

    hydrateTagDescriptions(),
    fetchBoardWindow(context.parentKey || null, context.sprintWindowExtend || 0, context.assigneeScope === 'all', !!context.fullWindow),
    hydrateSprints(),
    context.parentKey ? _fetchTaskForHandoff(context.parentKey).catch(() => null) : Promise.resolve(null),
  ]);

  // requests. Errors swallow to [] via _projectTaskIndex() — a failed chain fetch must
  // never break the board, same rule the parentTask fetch above already follows.

    ? subtaskChain.buildAncestorCrumbs(parentTask.parentDbId, await _projectTaskIndex())
    : [];

    tasks: boardResult.tasks,
    window: boardResult.window,

function _applyBoardSnapshotMetadata(snapshot) {
  if (Array.isArray(snapshot?.sprints)) state.sprints = _cloneBoardJson(snapshot.sprints, []);
  if (snapshot?.tagDescriptions instanceof Map) state.tagDescriptions = new Map(snapshot.tagDescriptions);
  else if (Array.isArray(snapshot?.tagDescriptions)) state.tagDescriptions = new Map(snapshot.tagDescriptions);

function isAuthLoadError(err) {
  return err && (err.authError || err.statusCode === 401 || err.statusCode === 403
    || /Authentication required|Access denied/i.test(err.message || ''));
}

    if (!document.getElementById('api-status-banner')) { stopOfflineRetry(); return; } // × dismissed
    loadAndRender().catch(() => {}); // success clears banner (end of loadAndRender) + stops timer
  }, 5000);
}
function stopOfflineRetry() {
  if (_offlineRetryTimer) { clearInterval(_offlineRetryTimer); _offlineRetryTimer = null; }
}

function renderTaskLoadError(err) {
  if (isAuthLoadError(err)) {
    if (state.lastLoadedTaskCount === 0) {
      app.innerHTML = `<div class="error-box"><h2>Sign-in required</h2><p>Waiting for re-authentication…</p></div>`;
    }
    return;
  }
  if (state.lastLoadedTaskCount > 0) {
    showApiStatusBanner('disconnected', err.message || 'Could not load tasks');
    startOfflineRetry();
    // (C1387) app.innerHTML is untouched on this branch (cards + their rings survive), but the
    // caller's own updateClaudeButtons() call never runs since loadAndRender() returns before
    // it — sweep here so a raise that landed during the failed fetch still paints.
    TipTask.taskBoard?.syncActiveSessionsNav?.();
    return;
  }
  // (C1392) Electron-vs-browser split, matching the guidance also used by the
  // task-open-failure banner in task-board.js — see utils.js loadErrorGuidance().
  const g = loadErrorGuidance({ isElectron: !!window.electronAPI?.api });
  app.innerHTML = `
    <div class="error-box">
      <h2>${g.title}</h2>
      <p>${g.hint}</p>
      ${g.command ? `<code>${g.command}</code>` : ''}
      <p style="margin-top:0.75rem">${g.followUp}</p>
    </div>`;
}

function refreshBoardSnapshotInBackground(cacheKey, previousFingerprint, context = null) {
  if (!cacheKey || _boardTaskRefreshes.has(cacheKey)) return;

  // BOARD_TASK_REFRESH_MIN_AGE_MS above.
  const existing = _boardTaskCache.get(cacheKey);
  if (existing && (Date.now() - existing.storedAt) < BOARD_TASK_REFRESH_MIN_AGE_MS) return;
  const generation = _boardTaskCacheGeneration;
  const refresh = (async () => {
    try {
      const snapshot = await fetchBoardSnapshot(context || _boardTaskCacheContext());
      const nextFingerprint = _boardSnapshotFingerprint(snapshot);
      _rememberBoardSnapshot(cacheKey, snapshot, context, generation);
      if (generation !== _boardTaskCacheGeneration) return;
      if (cacheKey !== _boardTaskFilterHash()) return;
      if (nextFingerprint !== previousFingerprint) {
        await loadAndRender({ forceFresh: true, cacheKey, snapshot });
      } else if (document.getElementById('api-status-banner')) {
        showApiStatusBanner('connected');
      }
    } catch (err) {
      if (cacheKey === _boardTaskFilterHash() && state.lastLoadedTaskCount > 0) {
        showApiStatusBanner('disconnected', err.message || 'Could not load tasks');
        startOfflineRetry();
      }
    } finally {
      if (_boardTaskRefreshes.get(cacheKey) === refresh) _boardTaskRefreshes.delete(cacheKey);
    }
  })();

}

    terminalLaunch: workspace.terminalLaunch,

      const pinnedAgent = (agentAssignee === 'claude' || agentAssignee === 'codex') ? agentAssignee : null;

      } else if (pinnedAgent) {
        return openTerminal(id, title, desc, status, { agent: pinnedAgent });
      } else if (state.availableAgents.length > 1 && state.sessionAgent === null) {
        return openAgentSelectorModal(id, title, desc, status);
      } else if (state.sessionAgent) {
        return openTerminal(id, title, desc, status, { agent: state.sessionAgent });
      } else {
        return openTerminal(id, title, desc, status);
      }
    },
    onLoadAndRender: (opts) => loadAndRender(opts),
  });
}

// Terminal task-title links land on the real board path, then open the same live-task
// modal used by board card double-clicks. Waiting for loadAndRender() first ensures the
// selected section and task caches are current before the modal fetch starts.
// (TPT111) openBoardTaskEditModal()'s own showBoardLoader()/hideBoardLoader() only covers
// its own fetch — it says nothing about the loadAndRender() wait ahead of it, which is
// normally the longer leg on this path. Wrap both in one ref-counted show/hide so the
// loader appears immediately on this entry point too.
registerTaskEditNavigation(async (taskId) => {
  state.activeTab = 'board';
  utils.showBoardLoader();
  try {
    await loadAndRender({ scrollToTop: true });
    return await openBoardTaskEditModal(taskId);
  } finally {
    utils.hideBoardLoader();
  }
});

// (TPT466) Terminal and chat launchers (openTerminal / taskChat.open, via openTaskWorkspace)
// open the same live-task modal as a card double-click, on their own pane — so a Start from
// the Edit pane, the agent picker or a confirm all lead back through the same Start ladder.
registerTaskWorkspaceOpener((taskId, { initialPane, terminalLaunch, trigger } = {}) =>
  openBoardTaskEditModal(taskId, trigger, { initialPane, terminalLaunch }));

// Register callbacks that link card/board modules to functions defined in this inline script
registerCardCallbacks({
  // (C1438) Passthrough, not a bare call — _onDragEnd (task-card.js) is the one caller that
  // now passes { forceFresh: true, afterDrop: true } so its post-drop render reflects the
  // order just written (instead of the cached pre-drop snapshot) and isn't deferred by the
  // drag-suppression guard it's escaping. Every other call site still passes nothing.
  onLoadAndRender: (opts) => loadAndRender(opts),
  onOpenTerminal: (taskId, title, desc, status, opts) => openTerminal(taskId, title, desc, status, opts),
  onOpenAgentSelectorModal: (taskId, title, desc, status, opts) => openAgentSelectorModal(taskId, title, desc, status, opts),
  onShowClaudeConfirmModal: (taskId, title, desc, status, opts) => showClaudeConfirmModal(taskId, title, desc, status, opts),
  onShowConfirmModal: (taskId, prev, next) => showConfirmModal(taskId, prev, next, loadAndRender),
  // (C1259) showDeleteConfirmModal() already patches the card out of the DOM itself
  // (removeCardFromDom(), task-card.js) — this callback only needs the same stale-
  // selection cleanup the board WS's own task:deleted handler does, not a full reload.
  onShowDeleteConfirmModal: (taskId, title) => showDeleteConfirmModal(taskId, title, () => {
    if (state.selectedCardIds.has(taskId)) {
      state.selectedCardIds.delete(taskId);
      updateBulkActionBar();
    }
  }),
  onUpdateBulkBar: () => updateBulkActionBar(),
  onShowReiterateModal: (taskId, taskTitle) => showReiterateModal(taskId, taskTitle, loadAndRender),
  onFetchActiveSessions: async () => { await fetchActiveSessions(); updateClaudeButtons(); },
  onOpenAgentAssignModal: (taskId, current, status) => openAgentAssignModal(taskId, current, status, loadAndRender),
  onOpenTaskEditModal: (taskId, trigger) => openBoardTaskEditModal(taskId, trigger),
  onOpenPreviewCardModal: async (cardEl) => {
    const msgIdx = parseInt(cardEl.dataset.msgIdx);
    const cardIdx = parseInt(cardEl.dataset.cardIdx);
    const msg = state.chatState?.messages?.[msgIdx];
    if (!msg) return;
    let proposal = msg.cards?.[cardIdx];
    if (!proposal?.task) return;
    let isModified = proposal.type === 'modified';
    const virtualId = cardEl.dataset.taskId || `preview-${msgIdx}-${cardIdx}`;

    // C1095/C1109: a modified proposal opens the dual-panel diff — compareTask is the live
    // task it targets, sourced from the same snapshot hydrateModifiedCard() reads. This MUST
    // resolve (and reconcile the card's omitted fields, C1071) before the proposal is cloned
    // below — cloning first froze a pre-hydration copy and rendered the PROPOSED column blank
    // (C1109). The snapshot is transient (stripped on persist, chat-ui.js) so this refetches
    // lazily via ensureExistingSnapshot's own instanceof-Map guard; compareTaskId is a fallback
    // for when the target isn't in the scoped TODO.md snapshot at all.
    let compareTask = null;
    let compareTaskId = null;
    if (isModified) {
      await ensureExistingSnapshot(msg);
      // Re-read after the await: a task-cards/cards-update WS frame, or the reconcile
      // ensureExistingSnapshot just ran, can replace msg.cards or flip this card's type
      // (modified -> new, when its target no longer exists) while we were waiting.
      proposal = msg.cards?.[cardIdx];
      if (!proposal?.task) return;
      isModified = proposal.type === 'modified';
      if (isModified) {
        compareTask = msg._existingTasksSnapshot?.get(proposal.task.id) || null;
        if (!compareTask) compareTaskId = proposal.task.id;
      }
    }

    // Clone task so opens don't mutate proposal state before Save. Cloned AFTER the
    // snapshot/reconcile above so a modified card's omitted fields (title etc, C1071) are
    // already backfilled onto proposal.task.
    const preloaded = structuredClone(proposal.task);
    // Default member assignee to the current user (author) when none is set — 'new'
    // cards only. A 'modified' proposal targets an existing task; defaulting its
    // assignee here would silently reassign that task's owner on save (C1095).
    if (!isModified && preloaded.assignee == null && state.currentUserId != null) {
      preloaded.assignee = state.currentUserId;
    }
    // Sibling proposal cards in this message — offered in the deps typeahead
    // alongside persisted tasks so a new task can depend on another new task
    // in the same batch (not-yet-real new-* ids included; remapped to real
    // keys post-accept by applyIdRemapToDeps).
    const depCandidates = (msg.cards || [])
      .map((c, i) => (i !== cardIdx && c?.task) ? { id: c.task.id, title: c.task.title, status: c.task.status } : null)
      .filter(Boolean);

    openTaskEditModal(virtualId, {
      preloadedTask: preloaded,
      depCandidates,
      compareTask,
      compareTaskId,
      // C1109: openTaskEditModal only hydrates its own compareTask-derived clone (the
      // compareTaskId fallback fetch — see task-board.js) — proposal.task itself stays thin
      // unless/until Save. Hydrate it here too so the chat card list (and a re-open before
      // Save) show the real title/description rather than blank.
      onCompareTaskResolved: isModified ? (resolvedCompareTask) => {
        // C1111: a modified proposal's own status is discarded on accept unless the user
        // explicitly set it in this modal (C1072 / _statusEdited), so show and lock on the
        // LIVE task's status instead. Seeded onto `preloaded` — openTaskEditModal fires this
        // callback BEFORE cloning preloadedTask into _modalState.original/draft/lastSaved
        // (task-board.js, same ordering hydrateModifiedCard() relies on), so draft.status is
        // real by the time _applyModalLockState() and the click-to-edit guards read it.
        // `preloaded` is an ephemeral clone — nothing here reaches proposal.task or persisted
        // chatState.
        if (!proposal._statusEdited && resolvedCompareTask?.status) {
          preloaded.status = resolvedCompareTask.status;
        }
        if (hydrateModifiedCard(proposal, resolvedCompareTask)) saveChatState();
      } : undefined,
      onOpenLiveTask: isModified ? (taskId) => openBoardTaskEditModal(taskId) : undefined,
      onSavePreview: async (draft) => {
        const cmp = compareTask || {};
        // hadField: the original proposal already named this field explicitly — write
        // it back even if it happens to equal the live value. Otherwise (modified
        // cards only) only write back a field that actually changed vs the live task —
        // an untouched field must stay ABSENT so hydrateModifiedCard()/Object.assign
        // downstream can't coerce it into a concrete '' / [] that wipes the live task
        // on accept (C1095/P2 — this modal previously only ever opened for 'new' cards,
        // where unconditional writes were always correct).
        const hadField = (f) => Object.prototype.hasOwnProperty.call(proposal.task, f) && proposal.task[f] !== undefined;
        // C1109: additionally never write a field back as `undefined` — draft[f] is undefined
        // only when neither hydration nor compareTask ever supplied a value for it (nothing
        // useful to write), and an own `undefined` property on proposal.task is read by
        // Object.assign(existing, card.task) downstream as "clear this field", not "leave it
        // alone" — that's how an unhydrated proposal could wipe a live task's title on save.
        if (draft.title !== undefined && (!isModified || hadField('title') || draft.title !== (cmp.title || ''))) {
          proposal.task.title = draft.title;
        }
        if (draft.description !== undefined && (!isModified || hadField('description') || draft.description !== (cmp.description || ''))) {
          proposal.task.description = draft.description;
        }
        if (draft.tags !== undefined && (!isModified || hadField('tags') || JSON.stringify(draft.tags || []) !== JSON.stringify(cmp.tags || []))) {
          proposal.task.tags = Array.isArray(draft.tags) ? [...draft.tags] : [];
        }
        if (draft.dependencies !== undefined && (!isModified || hadField('dependencies') || JSON.stringify(draft.dependencies || []) !== JSON.stringify(cmp.dependencies || []))) {
          proposal.task.dependencies = Array.isArray(draft.dependencies) ? [...draft.dependencies] : [];
        }
        // C1072: only write status back when the user actually changed it (avoids
        // stamping an explicit `undefined` where the card had none) — a modified card
        // otherwise carries no status at all (see chat-task-preview.js
        // assertPendingProposalStatus). _statusEdited flags real user intent.
        // C1111: preloaded.status is now the LIVE task's status in diff mode (seeded in
        // onCompareTaskResolved above), not the proposal's — so this guard is a no-op
        // unless the user actually touches the status <select>, exactly as before.
        if (draft.status !== undefined && draft.status !== preloaded.status) {
          proposal.task.status = draft.status;
          proposal._statusEdited = true;
        }
        if (!isModified || hadField('agentAssignee') || (draft.agentAssignee || null) !== (cmp.agentAssignee || null)) {
          proposal.task.agentAssignee = draft.agentAssignee || null;
        }
        // (TPT197) Per-agent model slots + Claude design mode — the modal now exposes these in
        // proposal mode. Same guard shape as agentAssignee above: a `modified` card only gets a
        // field written if the proposal already carried it or the user moved it off the live
        // task's value, so an untouched field never overwrites the live task on accept. Every
        // slot is copied regardless of the selected agent (a real task keeps claude_model after
        // a switch to Codex; it's just not read), and Pi's model rides with agentAssignee:'pi'.
        // (TPT285) `effort` rides the same guard — one shared column, null = inherit.
        for (const f of ['claudeModel', 'codexModel', 'piModel', 'effort']) {
          if (!isModified || hadField(f) || (draft[f] || null) !== (cmp[f] || null)) {
            proposal.task[f] = draft[f] || null;
          }
        }
        if (!isModified || hadField('claudeDesignMode') || !!draft.claudeDesignMode !== !!cmp.claudeDesignMode) {
          proposal.task.claudeDesignMode = !!draft.claudeDesignMode;
        }
        if (!isModified || hadField('assignee') || (draft.assignee || null) !== (cmp.assignee ?? null)) {
          proposal.task.assignee = draft.assignee || null;
        }
        // Persist Sprint/Step change: runs cascade + _stepPinned flag so it's honoured on accept
        if (draft.priority !== proposal.task.priority) {
          await commitPreviewStep(msg, cardIdx, draft.priority);
        }
        // Update DOM card so captureCardEdits reads new values on reload
        const domCard = document.querySelector(`.preview-card[data-msg-idx="${msgIdx}"][data-card-idx="${cardIdx}"]`);
        if (domCard) {
          const titleEl = domCard.querySelector('.preview-title');
          const descEl = domCard.querySelector('.preview-desc');
          const depsEl = domCard.querySelector('.preview-deps');
          // C1158: draft.title can be undefined for an untouched modified card (the
          // write-back guard above only sets proposal.task.title for a real change) —
          // writing it here unguarded would render the literal string "undefined" into
          // the card.
          if (titleEl && draft.title !== undefined) titleEl.innerText = draft.title;
          if (descEl) descEl.dataset.raw = draft.description || '';
          if (depsEl) depsEl.textContent = proposal.task.dependencies.length ? `Deps: ${proposal.task.dependencies.join(', ')}` : '';
        }
        closeTaskEditModal(true);
        await loadAndRender();
      },
      onLoadAndRender: (opts) => loadAndRender(opts),
    });
  },
});

document.addEventListener('tiptask:reload', () => {
  // (C1293) Objective saves, manual saves, and terminal status transitions must bypass any
  // cached snapshot. A new task or a newly-started task otherwise waits for the cache's
  // background refresh before appearing behind the terminal.
  // (TPT58) staleBoardTaskCache(), not invalidateBoardTaskCache() — the forceFresh render
  // below already refetches the CURRENT drill-down key fresh; other objectives' cached
  // entries have nothing to do with this event and should survive for their own next tab
  // click instead of being thrown away.
  staleBoardTaskCache();
  loadAndRender({ forceFresh: true }).catch(() => {});
});

// (C1356) Dispatched by console-modal.js on terminal exit/close/minimize/reattach — an
// authoritative, forced left-nav status resync independent of tiptask:reload's board
// rebuild (which is sprint-windowed, C1259/C1324, so a session on an older sprint can't
// learn its own completion from it — see syncNavStatusesFromServer()'s own comment above
// for why the unfiltered /api/project/tasks fetch it uses doesn't share that limitation).
document.addEventListener('tiptask:sync-nav-statuses', () => {
  syncNavStatusesFromServer({ force: true });
});

// (C1453) Dispatched by task-board.js's refreshParentSubtaskLabel() right after it patches a
// parent objective card's Subtasks N/M label in place — that helper has no import path to
// this file's _boardTaskCache (template.html-local), so it bridges the same partial-count
// patch here via applyObjectiveTaskState(), which already knows how to merge a partial patch
// into both the cache entries (refreshing their fingerprints) and state._lastVisibleTasks
// without touching status/attention (the patch carries no `status` key, so those branches
// no-op — see applyObjectiveTaskState() above).
document.addEventListener('tiptask:task-cache-patch', (e) => {
  applyObjectiveTaskState(e.detail?.tasks);
  // (C1463) Same partial patch can move a child's closed status, so the objective tab's
  // green-tick can flip live off this event too, without waiting for a board reload.
  if (syncObjectiveTabsState()) repaintObjectiveNavTabs();
});

// (C1462) Dispatched by task-board.js's updateClaudeButtons() tail — the local-session-
// start signal, for the case where a session starts with no full loadAndRender() in
// between (openTerminal()'s ws.onopen, startTaskSession()). See syncObjectiveTabsState()'s
// own doc comment for the full two-signal contract.
document.addEventListener('tiptask:objective-tabs-sync', () => {
  if (syncObjectiveTabsState()) repaintObjectiveNavTabs();
});

// (C1293) Electron's __attention__ socket forwards task-state events here because the full
// board socket is intentionally not opened in Electron. Objective keeps its composer-mounted
// fast path; Tasks-section events patch the board behind an open terminal or force a fresh
// render when the changed card is not currently mounted.
function handleObjectiveTaskStateEvent(msg) {
  // (C1329) This function is Electron's ONLY route for every task-state event — no board WS.
  // The `if (!isTasksSectionTab()) return;` below used to gate the left-nav refresh too, so a
  // session's completion tick never reached the nav while Objective or Create was the open tab.
  // Reconcile the nav here, before any tab branch, so it always runs. Objective is excluded —
  // its own branch just below does an equivalent (and for `tasks-updated`, identical-cost)
  // reconcile via applyObjectiveTaskState/applyObjectiveTaskUpdate; doing it twice would just
  // duplicate work, not add correctness.
  if (state.activeTab !== 'objective') {
    if (msg?.type === 'task:updated' && msg.task?.id) {
      const taskId = String(msg.task.id);
      const prevStatusForNotify = window.TipTask.completionNotifications.observeTaskStatusForCompletion(
        state.taskStatusById, taskId, msg.task.status, msg.task.title);
      state.taskTitleById.set(taskId, msg.task.title || '');
      window.TipTask?.taskBoard?.syncActiveSessionsNav?.();
      // (C1462) Cross-window signal — see syncObjectiveTabsState()'s own doc comment.
      if (syncObjectiveTabsState({ task: msg.task, prevStatus: prevStatusForNotify })) repaintObjectiveNavTabs();
    } else if (msg?.type === 'tasks-updated') {
      syncNavStatusesFromServer();
    }
  }

  if (state.activeTab === 'objective') {
    const options = msg?.type === 'task:updated' && msg.task
      ? { objectiveTaskUpdate: msg.task }
      : msg?.type === 'tasks-updated'
        ? { objectiveTasksUpdated: true }
        : null;
    if (!options) return;
    clearTimeout(boardRefreshTimer);
    loadAndRender(options).catch(() => {});
    return;
  }

  if (!isTasksSectionTab()) return;
  if (msg?.type === 'task:updated' && msg.task?.id) {
    const task = msg.task;
    const taskId = String(task.id);
    // Drop any in-flight full render based on the previous task status before patching the
    // currently mounted card. The cache is also patched (not wiped) so later navigation to a
    // DIFFERENT drill-down still serves an instant cache hit instead of a cold refetch.
    // (C1329) state.taskStatusById/taskTitleById and syncActiveSessionsNav() are already
    // handled by the prologue above — it runs for every non-Objective tab, this one included.
    invalidateLoadAndRender();
    // (TPT58) This event carries the full updated row, so merge it into every cached
    // drill-down snapshot in place rather than invalidateBoardTaskCache()'s whole-Map wipe —
    // that wipe was firing on nearly every task event while a subtask session ran, so an
    // objective nav tab click almost never got to serve a cache hit.
    patchCachedBoardTasks(new Map([[taskId, task]]));
    if (state.pendingTaskIds.has(taskId)) state.pendingTaskIds.delete(taskId);
    if (msg.isNewlyAssigned) applyNewlyAssigned(taskId);
    const pendingCard = app.querySelector(`.card[data-id="${CSS.escape(taskId)}"]`);
    if (pendingCard) pendingCard.classList.remove('pending-sync');
    if (applyTaskPatch(task) === 'reload') {
      clearTimeout(boardRefreshTimer);
      state.pendingRestoreContext = { scrollY: window.scrollY, cardId: state.selectedCardId, cardMode: state.expandedCardMode };
      boardRefreshTimer = setTimeout(() => {
        if (isTasksSectionTab()) loadAndRender({ forceFresh: true }).catch(() => {});
      }, 0);
    } else {
      // A status patch can move a card out of the selected facet; apply it immediately.
      applySearchFilter();
    }
    return;
  }

  if (msg?.type === 'tasks-updated') {
    invalidateLoadAndRender();
    // (TPT58) Payload-less — no single row to merge, so soft-stale instead of wiping; the
    // forceFresh render below still refetches the CURRENT drill-down key immediately.
    staleBoardTaskCache();
    clearTimeout(boardRefreshTimer);
    state.pendingRestoreContext = { scrollY: window.scrollY, cardId: state.selectedCardId, cardMode: state.expandedCardMode };
    boardRefreshTimer = setTimeout(() => {
      if (isTasksSectionTab()) loadAndRender({ forceFresh: true }).catch(() => {});
    }, 0);
  }
}

document.addEventListener('tiptask:task-state-update', (e) => {
  handleObjectiveTaskStateEvent(e.detail || {});
});

// (C1200) A field mic (New Objective #chat-input, new-task title/desc) is recording — defer
// loadAndRender() instead of wiping #app out from under it. See audio-recorder.js's
// hasLiveFieldRecording()/_liveFieldRecordings for why: the mic's DOM (wrap + button) is built
// imperatively after render and gets destroyed by the next `app.innerHTML = ...`, orphaning the
// in-flight recorder/WS/liveInserter. Coalesces repeated deferrals into one flush; deliberately
// drops any `snapshot`/`cacheKey` a deferred call carried (stale by the time it flushes) in favor
// of a fresh fetch. Bounded by the 10s silence auto-stop, so this can never hang indefinitely.
let _deferredRenderOptions = null;
document.addEventListener('tiptask:voice-field-recording', (e) => {
  if (e.detail?.active || !_deferredRenderOptions) return;
  const opts = _deferredRenderOptions;
  _deferredRenderOptions = null;
  loadAndRender(opts);
});

// (C1438) Same slot, same coalesce-and-flush discipline as the mic guard above — a live drag
// gesture holds direct references to DOM nodes (task-card.js's _dragState) that a full render
// would detach mid-gesture. `tiptask:drag-ended` fires once per gesture (drop committed,
// Escape-cancelled, or self-healed after a detached-DOM check) — see the guard this pairs
// with, just below hasLiveFieldRecording() in _loadAndRenderImpl.
document.addEventListener('tiptask:drag-ended', () => {
  if (!_deferredRenderOptions) return;
  const opts = _deferredRenderOptions;
  _deferredRenderOptions = null;
  loadAndRender(opts);
});

// (C1154) Last top-level view a completed render committed. Used to detect a *transition*
// into the Objective view — see the dismiss hook in loadAndRender().
let _lastRenderedTab = null;

// (C1427) Objective-pane control wiring shared by the full render tail (below) and the
// C1282 partial-repaint path (chat-ui.js's refreshObjectiveContent()). Extracted so the two
// render paths can't drift apart again — see tt-objective-chat-persistence.md § Lifecycle.
// (C1461) Project Board / Backlog are the two nav entry points into a fresh root-board
// view — landing on either while drilled into a subtask board must drop the parent
// context (state.subtaskStack/subtaskParentTask), or the board keeps fetching
// ?parentKey=... under a "Backlog"/"Project Board" label. Every landing-on-board/backlog
// call site (top-nav .nav-tabs, mobile menu, left-nav Tasks button) calls this BEFORE its
// own same-tab bail (C1256/C1258) — on a subtask board state.activeTab is already 'board',
// so the bail would otherwise swallow the click outright. Returns whether it actually
// cleared something, so a caller's same-tab bail can still fire when there was nothing to.
function exitSubtaskContextForTab(tab) {
  if ((tab === 'board' || tab === 'backlog') && state.subtaskStack.length > 0) {
    state.subtaskStack = [];
    state.subtaskParentTask = null;
    return true;
  }
  return false;
}

function bindTabButton(btn) {
  btn.addEventListener('click', () => {
    const next = btn.dataset.tab;
    const exitedSubtaskContext = exitSubtaskContextForTab(next);
    // (C1147) Clicking into the Objective view — even when its tab was already active —
    // should drop the completed tab's "Objective complete" card from the stack. Must stay
    // unconditional (before the C1256 same-tab bail below) — it fires precisely on the
    // already-active-tab case too.
    if (next === 'objective' && state.activeTabId) dismissObjectiveNotification(state.activeTabId);
    // (C1256) Re-clicking the already-active tab used to still pay a full loadAndRender()
    // (uncached fetch + app.innerHTML wipe + ~50-listener rewire) to repaint identical
    // markup. Value-based, so this is correct for both halves of the shared selector.
    // (C1461) Skipped when exitSubtaskContextForTab() just cleared the drill-down — activeTab
    // is unchanged ('board'/'backlog') but the fetch scope (parentKey -> root) is not.
    if (!exitedSubtaskContext && next === state.activeTab) { window.scrollTo(0, 0); return; }
    // (TPT274) The bulk bar renders on both Board and Backlog — drop the selection on any
    // real tab switch so ids picked on one tab can never drive a bulk action against cards
    // hidden on another. Before the re-render: renderCard() reads selectedCardIds.
    clearBulkSelection();
    state.activeTab = next;
    sessionStorage.setItem(ACTIVE_NEW_TAB_KEY, state.activeTab);
    loadAndRender({ scrollToTop: true });
  });
}

// (C1462) Objective nav tabs — one per objective with a started subtask session, rendered
// between the Project Board and Backlog buttons. No dedicated session-started WS broadcast
// exists, so state.objectiveTabs is kept current from two signals:
//  - the LOCAL signal: every terminal session this window currently knows about
//    (state.activeSessions) — covers a fresh start, a resumed session (no status
//    transition to react to), and self-heals after a page reload/boot.
//  - the CROSS-WINDOW signal: a subtask's status crossing into the in_progress role on a
//    task:updated frame — the only WS-visible proxy for "a session started elsewhere"
//    (maybeAdvanceToInProgress() in console-modal.js is what produces it; it's skipped
//    entirely when resuming an already-in_progress task, hence the local signal above
//    still being necessary on its own).
// `hint` carries { task, prevStatus } for the cross-window case; omitted for the local
// sweep. Returns whether state.objectiveTabs actually changed, so callers can skip a
// repaint when nothing did. See ai/architecture/tt-task-subtasks.md § objectiveTabs.
function syncObjectiveTabsState(hint) {
  let changed = false;
  const tasksByDbId = new Map((state._lastVisibleTasks || [])
    .filter(x => x.dbId != null).map(x => [String(x.dbId), x]));

  if (hint?.task?.parentDbId != null && isInProgressName(hint.task.status) && !isInProgressName(hint.prevStatus)) {
    const parent = objectiveTabs.resolveObjectiveParent(hint.task.parentDbId, { tasksByDbId, parentTask: state.subtaskParentTask });
    if (parent && objectiveTabs.upsertObjectiveTab(state.objectiveTabs, parent)) changed = true;
  }

  for (const id of state.activeSessions) {
    // Same "started" definition as the left-nav active-sessions list (syncActiveSessionsNav,
    // task-board.js) — terminal sessions only, never an objective/spec-chat tab.
    if ((state.sessionMeta.get(id)?.type || 'terminal') !== 'terminal') continue;
    if (String(id).startsWith('obj-')) continue;
    const task = (state._lastVisibleTasks || []).find(x => x.id === id);
    if (task?.parentDbId == null) continue;
    const parent = objectiveTabs.resolveObjectiveParent(task.parentDbId, { tasksByDbId, parentTask: state.subtaskParentTask });
    if (parent && objectiveTabs.upsertObjectiveTab(state.objectiveTabs, parent)) changed = true;
  }

  // (C1463) Refresh every EXISTING tab's Subtasks N/M counts, for the tab's display-only
  // green-tick icon — role-derived throughout (isClosedName via subtaskCount.countChildProgress()),
  // never a hardcoded status literal. state._lastVisibleTasks holds full sibling child rows on
  // the root board, or — while drilled into that exact objective's own board — each CHILD laid
  // out as a top-level row (see tt-task-subtasks.md § Why the child's own card is mounted), so
  // filtering it by parentDbId works on either board. Falls back to the parent row's own
  // server-computed childrenCount/completedChildrenCount (list-route-only, C1435) when this
  // window has no child rows loaded for that objective at all. NEVER consulted for the close
  // button's confirm-or-not decision — that's a fresh, unscoped, authoritative server check
  // (ws-handlers.js's terminateChildren branch) precisely because this derivation can be short
  // of the true total under a narrowed People/assignee filter — see objective-tabs.js's
  // isObjectiveTabDone() doc comment.
  for (const tab of state.objectiveTabs) {
    const kids = (state._lastVisibleTasks || []).filter(x => String(x.parentDbId) === String(tab.parentDbId));
    let patch = null;
    if (kids.length) {
      const { total, done } = subtaskCount.countChildProgress(kids);
      patch = { childrenCount: total, completedChildrenCount: done };
    } else {
      const row = tasksByDbId.get(String(tab.parentDbId));
      if (row?.childrenCount != null) patch = { childrenCount: row.childrenCount, completedChildrenCount: row.completedChildrenCount };
    }
    if (patch && objectiveTabs.upsertObjectiveTab(state.objectiveTabs, { ...tab, ...patch })) changed = true;
  }

  return changed;
}

// (C1463) Each entry renders as a wrapper <span> holding the existing nav button (label,
// optional green-tick icon when isObjectiveTabDone()) plus a SIBLING close button — sibling,
// not nested, so there's no nested interactive element and the × stays out of the label
// button's overflow:hidden/text-overflow:ellipsis truncation (styles.css). `active` moves to
// the wrapper (was on the button pre-C1463) so the underline spans the whole tab including
// the ×. Neither the wrapper nor either button carries data-tab/data-mobile-tab — the
// generic .nav-tabs button[data-tab] delegation (bindTabButton) and the plain
// .mobile-menu-item click handler must not treat these as real tabs.
function renderObjectiveNavTabsHtml({ mobile = false } = {}) {
  const activeKey = objectiveTabs.activeObjectiveTabKey({ activeTab: state.activeTab, subtaskStack: state.subtaskStack, objectiveTabs: state.objectiveTabs });
  return state.objectiveTabs.map(tab => {
    const isActive = activeKey === tab.parentKey;
    const wrapCls = 'nav-tab-objective-wrap' + (mobile ? ' mobile-menu-item sub-item' : '') + (isActive ? ' active' : '');
    const label = objectiveTabs.objectiveTabLabel(tab);
    const title = escapeAttr(t('nav.objectiveBoardTab', { key: tab.parentKey, title: tab.title }));
    const tick = objectiveTabs.isObjectiveTabDone(tab)
      ? `<span class="nav-tab-objective-tick" aria-hidden="true" title="${escapeAttr(t('nav.objectiveTabDone'))}">✓</span>`
      : '';
    const closeTitle = escapeAttr(t('nav.objectiveTabClose', { key: tab.parentKey }));
    return `<span class="${wrapCls}"><button class="nav-tab-objective" data-objective-key="${escapeAttr(tab.parentKey)}" title="${title}">${tick}${escapeAttr(label)}</button><button class="nav-tab-objective-close" data-objective-close-key="${escapeAttr(tab.parentKey)}" title="${closeTitle}">×</button></span>`;
  }).join('');
}

// Targeted repaint for the out-of-band case (a session starts with no full loadAndRender()
// in between) — desktop/mobile hosts are re-emitted from scratch on every full render
// anyway, this just keeps them current between renders. No rebind needed: the click
// handler below is delegated once on #app.
function repaintObjectiveNavTabs() {
  const desktop = document.getElementById('nav-objective-tabs');
  if (desktop) desktop.innerHTML = renderObjectiveNavTabsHtml();
  const mobile = document.getElementById('mobile-objective-tabs');
  if (mobile) mobile.innerHTML = renderObjectiveNavTabsHtml({ mobile: true });
}

// (C1427) Import…/History/Debug-console controls render only inside chat-ui.js's
// renderObjectiveContent() (.chat-container) — renderNewTaskForm()'s own composer header never
// carries them — so scoping to `root` is safe on every caller: root === app on the full render,
// root === the freshly-swapped .chat-container on a partial repaint.
function wireObjectivePaneExtras(root) {
  // Import... sub-menu trigger. (C1241) Trigger renders in the composer's .chat-input-actions
  // (chat-ui.js), not the Tasks-section .nav-tabs.
  const importTrigger = root.querySelector('.import-menu-trigger');
  if (importTrigger) {
    importTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const wrap = importTrigger.closest('.import-menu-wrap');
      const existing = wrap.querySelector('.import-submenu');
      if (existing) { existing.remove(); return; }

      const submenu = document.createElement('div');
      submenu.className = 'import-submenu import-submenu--up';

      // From Jira (stub — no integration yet)
      const jiraItem = document.createElement('div');
      jiraItem.className = 'import-submenu-item';
      jiraItem.textContent = 'From Jira';
      jiraItem.addEventListener('click', () => {
        submenu.remove();
        showToast('Jira integration coming soon');
      });
      submenu.appendChild(jiraItem);

      // From Trello — static label, connection check deferred to click-time (no flicker)
      const trelloItem = document.createElement('div');
      trelloItem.className = 'import-submenu-item';
      trelloItem.textContent = 'From Trello';
      trelloItem.addEventListener('click', async () => {
        submenu.remove();
        try {
          // C1551 — must read the body + detect trello_not_configured before deciding
          // "not connected": the pre-existing code only ever branched on `data.connected`,
          // so a 503 (config fault) fell into the same "connect" path as a genuine
          // logged-out user, then repeated the same misdiagnosis one fetch later.
          const statusRes = await fetch('/api/trello/status');
          const data = await statusRes.json().catch(() => ({}));
          const nc = window.TipTask?.taskBoard?.integrationNotConfigured?.(data);
          if (nc) { showToast(t('integration.notConfiguredTitle', { service: 'Trello' }) + ' ' + nc.missing.join(', ')); return; }
          if (data.connected && window.TipTask?.taskBoard?.openTrelloWizard) {
            window.TipTask.taskBoard.openTrelloWizard(loadAndRender);
          } else {
            const initRes = await fetch('/api/trello/auth/initiate');
            const d = await initRes.json().catch(() => ({}));
            const nc2 = window.TipTask?.taskBoard?.integrationNotConfigured?.(d);
            if (nc2) { showToast(t('integration.notConfiguredTitle', { service: 'Trello' }) + ' ' + nc2.missing.join(', ')); return; }
            if (initRes.ok && d.url) window.open(d.url, '_blank');
            else showToast(t('trello.errInitiate'));
          }
        } catch {
          showToast(t('trello.errInitiate'));
        }
      });
      submenu.appendChild(trelloItem);

      // From Gmail — static label; wizard handles connect step internally
      const gmailItem = document.createElement('div');
      gmailItem.className = 'import-submenu-item';
      gmailItem.textContent = 'From Gmail';
      gmailItem.addEventListener('click', () => {
        submenu.remove();
        if (window.TipTask?.taskBoard?.openGmailWizard) {
          window.TipTask.taskBoard.openGmailWizard(loadAndRender);
        } else {
          showToast('Gmail import wizard coming soon');
        }
      });
      submenu.appendChild(gmailItem);
      wrap.appendChild(submenu);

      const closeSubmenu = (ev) => {
        if (!wrap.contains(ev.target)) {
          submenu.remove();
          document.removeEventListener('click', closeSubmenu);
        }
      };
      setTimeout(() => document.addEventListener('click', closeSubmenu), 0);
    });
  }

  const btnArchive = root.querySelector('#btn-archive');
  if (btnArchive) btnArchive.addEventListener('click', showRecipesModal);

  const chatConsoleToggle = root.querySelector('#chat-console-toggle');
  if (chatConsoleToggle) chatConsoleToggle.addEventListener('click', openObjectiveConsole);
}

// (C1427) Single door for wiring a repainted Objective subtree. The full render's own tail
// (below) reaches every one of these bindings its own way; this is what
// refreshObjectiveContent() (chat-ui.js, the C1282 partial repaint) and the restore path's
// post-render safety net call instead, since current.replaceWith() leaves the fresh subtree
// listener-less. Idempotent via the objWired stamp, so a redundant call (e.g. the restore
// safety net firing after a full render already wired this same node) is a cheap no-op
// rather than a double-bind.
window.TipTask.wireObjectivePane = (root) => {
  if (!root || root.dataset.objWired === '1') return;
  root.querySelectorAll('.composer-header-btn[data-tab]').forEach(bindTabButton);
  wireObjectivePaneExtras(root);
  setupCardInteractions(root);
  markTruncatedCards();
  root.dataset.objWired = '1';
};

// (C1259) Timed wrapper — kept as a thin outer shell (rather than instrumenting inside
// the ~1000-line body below) so the perf-log addition can't itself introduce a control-
// flow bug in a function with this many early-return branches. Gives the total
// fetch+group+build+innerHTML+listener-wiring duration per render; console.warn fires
// above perf-log.js's 200ms threshold — see the task's own "click paths that exceed
// 200ms" ask.
async function loadAndRender(options = {}) {
  // (C1327) A stale state.activeTab pointing at a hidden view would render a view with no tab
  // to leave by. Fall back to the board. Removed automatically when HIDDEN_VIEW_TABS is emptied.
  if (isHiddenViewTab(state.activeTab)) state.activeTab = 'board';
  const renderGeneration = invalidateLoadAndRender();
  const _handle = perfStart('load-and-render', { tab: state.activeTab, cacheable: _canUseBoardTaskCache(), forceFresh: !!options.forceFresh, snapshot: !!options.snapshot, objectiveTaskRefresh: !!(options.objectiveTaskUpdate || options.objectiveTasksUpdated) });
  try {
    return await _loadAndRenderImpl(options, renderGeneration);
  } finally {
    perfEnd(_handle);
  }
}

async function _loadAndRenderImpl(options = {}, renderGeneration = _loadAndRenderGeneration) {
  // (C1282) Objective stays mounted during live task updates. Refresh cache/maps and repaint
  // only the Objective pane; the normal load path below still owns navigation/full renders.
  if (options.objectiveTaskUpdate && state.activeTab === 'objective') {
    applyObjectiveTaskUpdate(options.objectiveTaskUpdate);
    if (!window.TipTask?.audioRecorder?.hasLiveFieldRecording?.()) {
      captureCardEdits();
      window.TipTask?.chatUI?.refreshObjectiveContent?.();
    }
    return;
  }
  if (options.objectiveTasksUpdated && state.activeTab === 'objective') {
    try {
      const objectiveTasks = await fetchObjectiveTaskState();
      if (!isCurrentLoadAndRender(renderGeneration)) return;
      applyObjectiveTaskState(objectiveTasks);
    } catch {
      // Aggregate refresh is opportunistic. Keep the mounted Objective and composer intact
      // when the status-only fetch is temporarily unavailable; the next event retries it.
      return;
    }
    if (!window.TipTask?.audioRecorder?.hasLiveFieldRecording?.()) {
      captureCardEdits();
      window.TipTask?.chatUI?.refreshObjectiveContent?.();
    }
    return;
  }
  // (C1200) See the tiptask:voice-field-recording listener above. `force: true` escapes this at
  // the two call sites (first paint, project switch) where showing stale content is worse than
  // losing an in-flight recording — both already destroy #chat-input outright anyway.
  if (!options.force && window.TipTask?.audioRecorder?.hasLiveFieldRecording?.()) {
    _deferredRenderOptions = {
      forceFresh: true,
      scrollToTop: (_deferredRenderOptions && _deferredRenderOptions.scrollToTop) || options.scrollToTop || undefined,
    };
    return;
  }
  // (C1438) A drag gesture or its drop is in flight — see tt-task-cards-drag-drop.md "Root
  // cause: drag vs. board re-render". This is the one choke point every render passes
  // through, so it covers every trigger that used to wipe #app mid-drag: the board-WS
  // handlers, the attention-ws bridge (Electron — the path with no drag awareness at all
  // before this), refreshBoardSnapshotInBackground(), tiptask:reload, and the offline retry.
  // `afterDrop` is the drop's own post-commit render (task-card.js _onDragEnd) escaping this
  // exact guard — without it the drop could never repaint its own result.
  if (shouldDeferForDrag({ afterDrop: !!options.afterDrop, dragging: isDragging(), dropInProgress: isDropInProgress() })) {
    _deferredRenderOptions = {
      forceFresh: true,
      scrollToTop: (_deferredRenderOptions && _deferredRenderOptions.scrollToTop) || options.scrollToTop || undefined,
    };
    return;
  }
  // (C1187) TTL'd fire-and-forget refresh — never awaited, so a teammate's status rename
  // in the web app surfaces on the next repaint without adding a round-trip to every
  // render (this runs on every WS frame / poll tick).
  refreshStatusesIfStale();
  // Preserve card edits before re-render
  captureCardEdits();
  const startScrollY = window.scrollY;
  if (state.activeTab !== 'todo') closeTodoDrawer();

  const canUseTaskCache = _canUseBoardTaskCache();
  const cacheContext = _boardTaskCacheContext();
  const cacheKey = options.cacheKey || (canUseTaskCache ? _boardTaskFilterHash(cacheContext) : null);
  const boardRenderState = {
    revision: state._boardRenderRevision || 0,
    statusFilter: new Set(state.statusFilter),
  };
  const cachedEntry = (!options.forceFresh && cacheKey) ? _boardTaskCache.get(cacheKey) : null;
  let tasks = [];
  // (C1256) Attributes the data-fetch phase of loadAndRender — snapshot (handed in by a
  // caller)/cache-hit/network — so the perf log can prove a tab switch stopped paying the
  // network branch. Kept permanent, not just for this task: cheap (perfStart no-ops when
  // state.debugPerfLog is off) and directly answers "why is this render slow" going forward.
  const _larData = perfStart('lar-data');
  let _larDataSource = 'network';
  try {
    if (options.snapshot) {
      _larDataSource = 'snapshot';
      tasks = _cloneBoardJson(options.snapshot.tasks, []);
      _applyBoardSnapshotMetadata(options.snapshot);
      _applyBoardWindow(options.snapshot.window, cacheContext.fullWindow);
      if (cacheKey) _rememberBoardSnapshot(cacheKey, options.snapshot, cacheContext);
    } else if (cachedEntry) {
      _larDataSource = 'cache';
      tasks = _restoreBoardCacheEntry(cachedEntry);
      // (C1256) Suppressed on the New-section tabs — a fingerprint diff makes this call
      // loadAndRender({forceFresh:true,...}) in the background (see refreshBoardSnapshotInBackground()
      // below), which would innerHTML-wipe the composer out from under a user mid-compose
      // (lost caret, closed Embed/Import popovers, collapsed textarea). No staleness lost:
      // storedAt keeps ageing, so the refresh fires the moment the user returns to a
      // Tasks-section tab and this same cache-hit branch runs there instead.
      if (!isNewSectionTab()) refreshBoardSnapshotInBackground(cacheKey, cachedEntry.fingerprint, cachedEntry.context || cacheContext);
    } else {
      const snapshot = await fetchBoardSnapshot(cacheContext);
      if (!isCurrentLoadAndRender(renderGeneration)) {
        perfEnd(_larData, { source: _larDataSource, stale: true });
        return;
      }
      tasks = _cloneBoardJson(snapshot.tasks, []);
      _applyBoardSnapshotMetadata(snapshot);
      _applyBoardWindow(snapshot.window, cacheContext.fullWindow);
      if (cacheKey) _rememberBoardSnapshot(cacheKey, snapshot, cacheContext);
    }
  } catch (err) {
    perfEnd(_larData, { source: _larDataSource, threw: true });
    if (!isCurrentLoadAndRender(renderGeneration)) return;
    // Auth errors are handled by the reauth modal (driven by api:connection:changed).
    // Show a quiet placeholder until the user signs in again.
    renderTaskLoadError(err);
    return;
  }
  if (!isCurrentLoadAndRender(renderGeneration)) {
    perfEnd(_larData, { source: _larDataSource, stale: true });
    return;
  }
  perfEnd(_larData, { source: _larDataSource });
  state.lastLoadedTaskCount = tasks.length;

  // (C1154) Dismiss the active objective sub-tab's "Objective complete" card when the board
  // *transitions into* the Objective view by any route — left-nav, empty-state CTA, recipe pick,
  // Trello/Gmail import, split-task overlay — not just the tab-bar/nav handlers C1147 wired.
  // Guarded on the transition (not merely on being on the objective tab) so a completion render
  // while the user is already viewing it does NOT dismiss: that would undo C1137's decision to
  // show the card even when the window is visible.
  if (state.activeTab === 'objective' && _lastRenderedTab !== 'objective' && state.activeTabId) {
    dismissObjectiveNotification(state.activeTabId);
  }
  _lastRenderedTab = state.activeTab;

  // Unfinalized reserve_task_keys placeholder rows ("New task", C1017) are excluded
  // from every user-facing render below — they're not real tasks yet. `tasks` itself
  // stays unfiltered — not renderNewTaskForm() (it doesn't read this param at all), but
  // the #new-task-preview click handler further down (C1245/C1256), whose next-id guess
  // (`C${max+1}`) must still see live reservations to avoid guessing a key someone else
  // already has reserved.
  const visibleTasks = tasks.filter(t => !t.isReservation);
  // (C1259) See state.js — lets filter-bar click handlers recompute facet counts and
  // patch chrome without a full loadAndRender(). Deliberately kept UNFILTERED by objective
  // grouping (C1460, see groupedTasks below) — refreshParentSubtaskLabel() (task-board.js)
  // looks up a grouping-hidden PARENT by dbId to update its Subtasks N/M count, and
  // applyObjectiveTaskState() patches rows in place by index; either would silently no-op
  // or go stale against a narrowed array. refreshFilterBarChrome() re-derives its own
  // grouped view from this same unfiltered list.
  state._lastVisibleTasks = visibleTasks;
  // (C1462) Must run before the innerHTML write below — the desktop/mobile nav tab markup
  // renders declaratively from state.objectiveTabs, so it needs to be current first.
  syncObjectiveTabsState();

  // Prune attention dots for completed/canceled tasks
  // (C1329) This fetch is assignee-scoped and sprint-windowed (window=active) — a long-running
  // session on an older sprint can fall outside it entirely, in which case a plain overwrite
  // would erase the only status the left-nav has for that session (including a completed tick
  // it already earned). Snapshot the outgoing maps first and backfill any active-session id the
  // new fetch didn't return, so a session's last known status survives every render regardless
  // of the window. Purely additive — only fills ids the fetch omitted — so it can never make
  // renderCard's dependency gating see a staler status than the fetch itself provided.
  const _prevTaskStatusById = state.taskStatusById;
  const _prevTaskTitleById = state.taskTitleById;
  const taskStatusById = new Map(tasks.map(t => [t.id, t.status]));
  const taskTitleById = new Map(tasks.map(t => [t.id, t.title || '']));
  for (const id of state.activeSessions) {
    if (!taskStatusById.has(id) && _prevTaskStatusById.has(id)) {
      taskStatusById.set(id, _prevTaskStatusById.get(id));
    }
    if (!taskTitleById.has(id) && _prevTaskTitleById.has(id)) {
      taskTitleById.set(id, _prevTaskTitleById.get(id));
    }
  }
  state.taskStatusById = taskStatusById; // shared with renderCard for dep-blocking
  // (C1058) Attention notifications fall back to this when no card is rendered for the task
  // (filtered out, collapsed tier, backlog, other tab) — the attention-needed WS payload
  // carries no title. See src/client/attention-notifications.js#notifyTaskNeedsAttention.
  state.taskTitleById = taskTitleById;
  // (C1387) Guarded — never prunes a task with a still-live terminal session, see
  // attention-state.js#pruneClosedAttention. This is the render-time counterpart of the same
  // guard applyObjectiveTaskState() above uses.
  TipTask.attentionState.pruneClosedAttention(taskStatusById, isClosedName);
  // Prune green attention for completed/canceled tasks
  for (const id of state.newlyAssignedTasks) {
    const s = taskStatusById.get(id);
    if (isClosedName(s)) clearNewAssignment(id);
  }

  const allTags = [...new Set([...visibleTasks.flatMap(t => t.tags || []), ...state.tagDescriptions.keys()])].sort();

  // (C1460) Objective grouping filter — decides whether an objective's subtasks or its
  // is_objective parent container is what the root board draws (never both); a no-op on a
  // subtask drill-down. See board-count-domain.js#tasksVisibleUnderGrouping and
  // tt-task-board.md § Objective Grouping Filter. Every root-board render/count call below
  // reads THIS, not raw visibleTasks — state._lastVisibleTasks above stays unfiltered.
  const groupedTasks = tasksVisibleUnderGrouping(visibleTasks, {
    objectiveGrouping: getObjectiveGroupingEnabled(),
    drilldown: state.subtaskStack.length > 0,
  });

  // (C1442) Counts must be scoped to what the ACTIVE tab can actually render — the
  // sprint-grouped Board/List/To-Do tabs drop backlog (no-sprint) tasks entirely, so counting
  // them here would promise a filter match the board has nowhere to draw (see
  // board-count-domain.js and tt-task-board.md § Filter Count Domain). Composition order is
  // fixed: grouping (C1460) narrows first, tab domain (C1442) narrows what's left.
  const countDomain = tasksForActiveTab(groupedTasks, { tab: state.activeTab, sprintsEnabled: getSprintsEnabled() });
  // (C1155) Faceted per-status counts, feeding the status-filter dropdown's option
  // labels — replaces the old unfiltered .summary row's total/pending/etc counts.
  const statusCounts = computeStatusCounts(countDomain);
  // (C1407) Faceted per-member counts, feeding the People-filter panel's member rows.
  const assigneeCounts = computeAssigneeCounts(countDomain);

  // Build children map (all tasks, incl. subtasks) — used by renderCard for inline subtask rows
  const childrenByParent = new Map();
  for (const t of visibleTasks) {
    if (t.parentId) {
      if (!childrenByParent.has(t.parentId)) childrenByParent.set(t.parentId, []);
      childrenByParent.get(t.parentId).push(t);
    }
  }
  state.childrenByParent = childrenByParent;

  // Group tasks into priority tiers — root tasks only (children rendered inline on parent card).
  // (C1460) The subtask-drill-down-vs-root split AND the parent/child filter both now live in
  // groupedTasks (tasksVisibleUnderGrouping is a no-op on a drill-down) — this used to be an
  // inline `!t.parentId` check that never matched (fromApi() never sets `parentId`, see
  // api-backend.js), i.e. was dead code; the C1460 predicate is what actually hides children now.
  const rootTasksRaw = groupedTasks;
  // (C1442) Was an inline third copy of the null-sprint predicate — now the shared
  // taskHasNullSprint() from board-count-domain.js, same one the count-domain helper below uses.
  const rootTasks = rootTasksRaw.filter(t => !taskHasNullSprint(t));
  const tiers = {};
  for (const t of rootTasks) {
    const p = t.priority ?? 99;
    (tiers[p] ??= []).push(t);
  }
  // Add empty containers for API sprint records that have no tasks yet (future/unassigned sprints).
  // (C1259) On the root board (not a subtask drill-down), the task fetch itself is
  // windowed — a sprint number below the window floor has tasks we simply didn't fetch,
  // so synthesizing an "empty" container for it would misrepresent a sprint that may
  // actually hold completed work. `state.sprints` (this loop's source) is NOT windowed —
  // it's the full sprint-records list — so this gate is the only thing keeping historical
  // sprints out of the tier list once the task fetch stopped including them.
  const _windowFloor = (state.boardWindow && state.subtaskStack.length === 0) ? state.boardWindow.floor : undefined;
  // (C1460) A sprint can hold ONLY the children of a grouping-hidden objective — e.g. the
  // C1464 sprint cascade spreads an objective's subtasks across several sprints and ensures
  // a `sprints` row exists for each one. Without this, such a sprint would render as a bare
  // "Batch N" header with zero cards once its only occupants are grouping-hidden. Test against
  // the UNGROUPED visibleTasks: only skip synthesizing the empty container when the sprint
  // would ALSO be empty there — a sprint that's genuinely empty (no tasks at all) still gets
  // its container, same as before.
  const _sprintHasUngroupedTask = new Set(visibleTasks.filter(t => !taskHasNullSprint(t)).map(t => t.priority ?? 99));
  for (const sp of state.sprints) {
    const num = sp.number ?? sp.id;
    if (num == null || tiers[num] != null) continue;
    if (_windowFloor !== undefined && (_windowFloor == null || num < _windowFloor)) continue;
    if (_sprintHasUngroupedTask.has(num)) continue; // C1460: every task here is grouping-hidden
    tiers[num] = [];
  }
  const tierKeys = Object.keys(tiers).map(Number).sort((a, b) => a - b);
  state.tierKeys = tierKeys;
  state.tiers = tiers;

  // ── Manual Task Creation ── (cheap — kept unconditional; §1649 below reads it too)
  const _parentTaskKey = state.subtaskStack.length
    ? state.subtaskStack[state.subtaskStack.length - 1].taskKey
    : null;

  const isTasksSection = isTasksSectionTab();
  const isNewSection = isNewSectionTab();
  // (C1460) Grouped, not raw visibleTasks — a board whose every row is grouping-hidden (e.g.
  // the sole project task is an objective parent's now-invisible child) must show the
  // New Task/Create Objective CTA (renderEmptyBoardContent), not a stack of bare tier headers.
  const isEmptyBoard = isTasksSection && groupedTasks.length === 0;

  // (C1259) Build ONLY the view that's actually about to be inserted below. This used to
  // build all six views (board/list/todo/backlog/new_task/objective) unconditionally and
  // throw away five of them every single render — renderCard() (and its marked.parse()
  // call per card) ran 2-3x more than needed, and renderObjectiveContent() markdown-
  // rendered the entire chat transcript even while the user was looking at the board.
  let tabContent = '';
  // (C1256) Spans the view-build phase — answers C1256 sub-item (1) ("profile
  // renderComposerHeader() for synchronous work") with a real number per switch instead of a
  // guess: renderComposerHeader() itself is a 2-button string builder called from inside
  // renderNewTaskForm()/renderObjectiveContent() below, so wrapping those two callers is
  // where the real per-tab cost (if any) would show up — e.g. renderObjectiveContent()
  // markdown-rendering the whole chat transcript.
  const _larBuild = perfStart('lar-build', { tab: state.activeTab });
  if (!isEmptyBoard) {
