      overlay.querySelectorAll('.tag-cloud-item').forEach(item => {
        item.addEventListener('click', () => {
          const _h = perfStart('tag-filter-toggle', { tag: item.dataset.tag });
          const tag = item.dataset.tag;
          if (state.activeTagFilters.has(tag)) {
            state.activeTagFilters.delete(tag);
            item.classList.remove('active');
          } else {
            state.activeTagFilters.add(tag);
            item.classList.add('active');
          }
          changed = true;
          state.allStepsLoaded = false;
          refreshBoardForFilters(loadAndRender).finally(() => perfEnd(_h));
        });
      });

      // Close modal
      // Each toggle already rerenders the cached board. Refresh chrome on close and
      // keep rebuilt tag chips wired to that same rerender callback.
      const closeModal = () => {
        overlay.remove();
        if (changed) refreshFilterBarChrome(app, loadAndRender);
      };
      overlay.querySelector('.tag-cloud-close').addEventListener('click', closeModal);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
      document.addEventListener('keydown', function escHandler(e) {
        if (e.key === 'Escape') {
          document.removeEventListener('keydown', escHandler);
          closeModal();
        }
      });
    });
  }

  // ── Tag filter chip removal ──
  // refreshFilterBarChrome() rebuilds this same chip bar
  // (and rebinds its own click listeners — see task-board.js) whenever state.activeTagFilters
  // changes, so the initial binding here only has to cover the very first paint.
  app.querySelectorAll('.tag-filter-chips .tag-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const _h = perfStart('tag-filter-chip-remove');
      const tag = chip.dataset.tag;
      state.activeTagFilters.delete(tag);
      state.allStepsLoaded = false;
      refreshBoardForFilters(loadAndRender).finally(() => perfEnd(_h));
    });
  });

  // ── Show More button ──
  // (C1259) Two modes, chosen fresh on every click (state can change between clicks):
  // - local tiers already fetched but hidden behind the cutoff → reveal one page, no fetch
  // - nothing left to reveal locally, but the server-side sprint window (window.has_older)
  //   says older sprints exist → widen the window (extend the floor 10 sprints further
  //   back) and refetch. Once the server reports has_older:false, _applyBoardWindow()
  //   sets allStepsLoaded and the button disappears — see updateShowMoreButton().
  const loadMoreBtn = document.getElementById('btn-load-more');
  if (loadMoreBtn) {
    loadMoreBtn.addEventListener('click', async () => {
      // (C1577) In ascending order the button sits above the timeline and newly revealed
      // sprints are PREPENDED above the current viewport — a raw scrollY restore would
      // leave the view visibly jumped down by the height of everything just inserted
      // above it. Anchor on the first visible tier's own screen position instead: capture
      // it before the fetch, then after re-render nudge scroll by however far that same
      // tier (matched by data-priority — it's still present, just no longer first) moved.
      const ascending = getSprintSortOrder() === 'asc';
      let anchorPriority = null, anchorTopBefore = null;
      if (ascending) {
        // (C1578) A card-less tier now stays in the DOM (hidden) as a drag-drop target, so
        // the plain .tier[data-priority] selector can match one — getBoundingClientRect() on
        // a display:none element is always {top:0,...}, which would silently zero out this
        // anchor. Skip hidden tiers; they never move on screen anyway.
        const firstTier = document.querySelector('.tier[data-priority]:not(.tier--empty)');
        if (firstTier) {
          anchorPriority = firstTier.dataset.priority;
          anchorTopBefore = firstTier.getBoundingClientRect().top;
        }
      }
      const savedScrollY = window.scrollY;
      // (C1333) Flat board has no tier cutoff to reveal — state.tiers stays populated
      // (built regardless of active view) so computeVisibleTiers() would still report
      // hiddenCount > 0 and bump extraStepsLoaded for nothing, leaving the button a no-op.
      // Sprints off always means "widen the server window".
      const { hiddenCount } = getSprintsEnabled()
        ? computeVisibleTiers(state.tierKeys, state.tiers)
        : { hiddenCount: 0 };
      if (hiddenCount > 0) {
        state.extraStepsLoaded += anyNarrowingFilterActive() ? FILTERED_TIER_PAGE_SIZE : 10;
      } else {
        state.sprintWindowExtend += 10;
      }
      await loadAndRender();
      if (ascending && anchorPriority != null) {
        const sameTier = document.querySelector(`.tier[data-priority="${anchorPriority}"]`);
        if (sameTier) {
          const delta = sameTier.getBoundingClientRect().top - anchorTopBefore;
          window.scrollTo(0, window.scrollY + delta);
        } else {
          window.scrollTo(0, savedScrollY);
        }
      } else {
        window.scrollTo(0, savedScrollY);
      }
    });
  }

  // Apply search filter after render (preserves active search across re-renders)
  applySearchFilter();

  // Burger menu toggle
  const burgerBtn = app.querySelector('.burger-btn');
  const mobileMenu = app.querySelector('.mobile-menu');
  const backdrop = app.querySelector('.mobile-menu-backdrop');

  function toggleMobileMenu(open) {
    state.mobileMenuOpen = open;
    burgerBtn.classList.toggle('open', open);
    burgerBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    mobileMenu.classList.toggle('open', open);
    if (backdrop) backdrop.classList.toggle('open', open);
  }

  if (burgerBtn) {
    burgerBtn.addEventListener('click', () => toggleMobileMenu(!state.mobileMenuOpen));
  }

  if (backdrop) {
    backdrop.addEventListener('click', () => toggleMobileMenu(false));
  }

  // Mobile menu item clicks
  app.querySelectorAll('.mobile-menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      // (C1462) .mobile-objective-tabs' rows also carry the mobile-menu-item class (for
      // shared styling) but no data-mobile-tab — they're handled by the delegated
      // .nav-tab-objective click listener bound once on #app instead. Without this guard
      // `tab` below resolves to undefined and every branch past it misbehaves.
      if (!btn.dataset.mobileTab) return;
      const tab = btn.dataset.mobileTab;
      // (C1461) Same rule as the top-nav .nav-tabs handler below.
      exitSubtaskContextForTab(tab);
      if (tab === 'new') {
        if (!isNewSection) {
          const saved = sessionStorage.getItem(ACTIVE_NEW_TAB_KEY);
          state.activeTab = (saved === 'new_task') ? 'new_task' : 'objective';
        }
        if (state.chatState) state.chatState.tickSeen = true;
        // (C1156) Same reasoning as the left-nav '.left-nav-btn' handler above.
        if (state.activeTabId) dismissObjectiveNotification(state.activeTabId);
      } else {
        if (tab === 'objective' && state.chatState) {
          state.chatState.tickSeen = true;
        }
        // (C1147) Same reasoning as the top-nav .nav-tabs handler above.
        if (tab === 'objective' && state.activeTabId) dismissObjectiveNotification(state.activeTabId);
        state.activeTab = tab;
      }
      state.mobileMenuOpen = false;
      loadAndRender({ scrollToTop: true });
    });
  });

  // ── Chat send/stop/draft handlers (from chat-ui module) ──
  // (C1258) ensureGlobalChatBindings() carries the pieces that must bind regardless of section
  // (bind-once voice shortcut/file-link delegate, the Embed-menu teardown, the one-shot
  // obj-image-preview listener) — kept unconditional. attachChatHandlers() itself wires up
  // composer-only controls (tab bar, model select, tooltips, etc.) that don't exist in the DOM
  // at all on a board render, so it's now gated to the New section — was C1256's answer to "is
  // attachChatHandlers() part of the tab-switch cost", now the actual fix: 0ms on the board.
  ensureGlobalChatBindings();
  if (isNewSection) perfWrap('lar-attach-chat', attachChatHandlers);

  // ── Manual task creation handlers ──
  // Keep every form-phase lookup inside this render's New Task root. Pickers portal only
  // their dropdowns to <body>; field controls themselves never need document-wide lookup.
  const newTaskForm = document.getElementById('new-task-form');
  const newTaskPreviewBtn = newTaskForm?.querySelector('#new-task-preview');
  if (newTaskPreviewBtn) {
    newTaskPreviewBtn.addEventListener('click', () => {
      const titleEl = newTaskForm.querySelector('#new-task-title');
      const descEl = newTaskForm.querySelector('#new-task-desc');
      const priorityEl = newTaskForm.querySelector('#new-task-priority');
      const title = titleEl.value.trim();
      if (!title) { titleEl.focus(); return; }
      // (C1333) Sprints off -> task-board.js's renderNewTaskForm() omits the field
      // entirely, so priorityEl is null here by design, not a stuck-empty-combo bug.
      // Silently join the current active sprint instead of blocking the gate on it.
      let priority;
      if (!getSprintsEnabled()) {
        priority = currentActiveSprintPriority();
      } else {
        const priorityVal = priorityEl ? priorityEl.closest('.sprint-combo').dataset.current : '';
        if (!priorityVal) { if (priorityEl) priorityEl.focus(); return; }
        // (C1245) includeBacklog:true on this combo can now yield the 'null' sentinel.
        priority = priorityVal === '__new__'
          ? Math.max(...tierKeys, 0, sprintRecordMax(state.sprints)) + 1
          : priorityVal === 'null' ? 0 : Number(priorityVal);
      }

      // (C1245) Every field the composer collects beyond title/desc/priority/type/
      // tags, defaulted the same way _manualTaskStateFields() defaults them in
      // task-board.js — kept explicit (not a spread) since state.manualTaskState
      // may still be entirely null if the user never touched any of these controls.
      const s = state.manualTaskState || {};
      const category = s.category === 'HUMAN' ? 'HUMAN' : 'CODING';
      const status = s.status || startName();
      const agentAssignee = s.agentAssignee || (category === 'HUMAN' ? 'human' : '');
      // No state yet (form never touched) => same current-user default the form rendered.
      const memberAssignee = Object.hasOwn(s, 'assignee') ? (s.assignee ?? null) : (state.currentUserId ?? null);
      const claudeModel = s.claudeModel || null;
      const codexModel = s.codexModel || null;
      const piModel = s.piModel || null;
      const effort = s.effort || null;
      const claudeDesignMode = !!s.claudeDesignMode;
      const dependencies = Array.isArray(s.dependencies) ? s.dependencies : [];

      // Compute next task ID — category-aware (C1245): CODING guesses C###, HUMAN
      // guesses H###. `tasks` stays unfiltered (includes live reservations) so this
      // never guesses a key someone else already has reserved.
      const idPfx = category === 'HUMAN' ? 'H' : 'C';
      const idRe = category === 'HUMAN' ? /^H\d+$/ : /^C\d+$/;
      const usedIds = tasks.map(t => t.id).filter(id => idRe.test(id)).map(id => Number(id.slice(1)));
      const nextId = `${idPfx}${usedIds.length ? Math.max(...usedIds) + 1 : 1}`;

      const currentTags = (state.manualTaskState && state.manualTaskState.tags) || [];
      const samePriority = tasks.filter(t => t.priority === priority);
      const maxOrder = samePriority.length > 0 ? Math.max(...samePriority.map(t => t.order ?? 0)) : 0;
      const orderInStep = maxOrder + 1;
      const typeEl = newTaskForm.querySelector('#new-task-type');
      const taskType = typeEl ? typeEl.value : 'task';
      const desc = descEl.value.trim();
      const previewTask = {
        id: nextId,
        title,
        description: desc,
        category,
        type: taskType,
        status,
        priority,
        order: orderInStep,
        dependencies,
        tags: currentTags,
        agentAssignee,
        assignee: memberAssignee,
        claudeModel,
        codexModel,
        piModel,
        effort,
        claudeDesignMode,
        ...(_parentTaskKey ? { parentId: _parentTaskKey } : {}),
      };
      state.manualTaskState = {
        title,
        description: desc,
        priority,
        type: taskType,
        tags: currentTags,
        category,
        status,
        agentAssignee,
        assignee: memberAssignee,
        claudeModel,
        codexModel,
        piModel,
        effort,
        claudeDesignMode,
        dependencies,
        phase: 'preview',
        previewTask,
      };
      loadAndRender();
    });
  }

  const newTaskConfirmBtn = document.getElementById('new-task-confirm');
  if (newTaskConfirmBtn) {
    newTaskConfirmBtn.addEventListener('click', async () => {
      if (!state.manualTaskState || !state.manualTaskState.previewTask) return;
      const card = app.querySelector('.preview-card[data-task-id]');
      if (card) {
        const titleEl = card.querySelector('.preview-title');
        const descEl = card.querySelector('.preview-desc');
        if (titleEl) state.manualTaskState.previewTask.title = titleEl.innerText.trim();
        if (descEl) state.manualTaskState.previewTask.description = (descEl.dataset.raw || descEl.innerText).trim();
      }
      const change = { type: 'new', task: state.manualTaskState.previewTask };
      // (C1245) Only default to the current user when the Member select was left
      // on "(none)" — an explicit pick from the New Task form's Member Assignee
      // select must survive, not get clobbered by the old unconditional self-assign.
      change.task.assignee = change.task.assignee ?? ((_currentUser && _currentUser.id) || null);
      // _statusEdited unblocks assertPendingProposalStatus's start-status force
      // (chat-task-preview.js) so a chosen Status actually persists (C1245/B1).
      // _manual keeps saveTaskChange from attaching an unrelated objective's spec
      // comment / triggering server-side id reassignment — state.chatState is
      // global, not scoped to this tab (C1245/B2).
      change._statusEdited = true;
      change._manual = true;
      try {
        await saveTaskChange(change);
        clearDraft(DRAFT_KEY_TASK);
        sessionStorage.removeItem(ACTIVE_NEW_TAB_KEY);
        const priority = state.manualTaskState.previewTask.priority;
        state.collapsedTiers.delete(priority);
        state.expandedTiers.add(priority);
        state.manualTaskState = null;
        state.activeTab = 'board';
        invalidateBoardTaskCache();
        await loadAndRender({ scrollToTop: true, forceFresh: true });
      } catch (err) {
        showToast(t('modal.errSave', { msg: err.message }), 'error');
      }
    });
  }

  const newTaskBackBtn = document.getElementById('new-task-back');
  if (newTaskBackBtn) {
    newTaskBackBtn.addEventListener('click', () => {
      if (state.manualTaskState) {
        state.manualTaskState.phase = 'form';
      }
      loadAndRender();
    });
  }

  // (C1245) Status/Category/Agent/Model/Design-mode/Member/Dependencies rows —
  // everything the New Task form added beyond the pre-existing fields below. Pass
  // the form root; attachNewTaskFormHandlers resolves its metadata section locally.
  attachNewTaskFormHandlers(newTaskForm, { onRerender: () => loadAndRender() });

  // New Task draft auto-save (immediate — syncs state.manualTaskState + sessionStorage)
  const taskTitleEl = newTaskForm?.querySelector('#new-task-title');
  const taskDescEl = newTaskForm?.querySelector('#new-task-desc');
  if (taskDescEl) attachImagePaste(taskDescEl);
  if (taskTitleEl) attachAudioRecorder(taskTitleEl);
  if (taskDescEl) attachAudioRecorder(taskDescEl);
  const taskPriorityEl = newTaskForm?.querySelector('#new-task-priority');
  const taskPriorityCombo = taskPriorityEl ? taskPriorityEl.closest('.sprint-combo') : null;
  const taskTypeEl = newTaskForm?.querySelector('#new-task-type');
  if (taskPriorityCombo) {
    initSprintCombobox(taskPriorityCombo, { onSelect: (val) => {
      ensureManualTaskState().priority = val;
      saveNewTaskDraft();
    }});
  }
  if (taskTitleEl && taskDescEl && taskPriorityCombo) {
    // (C1245) Single writer (saveNewTaskDraft, task-board.js) now owns the actual
    // sessionStorage write — this just syncs the DOM-owned fields into state (lazily
    // creating it so a sprint/type-only-first interaction is never lost, same as the
    // new Status/Agent/Member/etc. handlers) and delegates. Fixes two latent bugs in
    // the writer this replaces: `type` used to be dropped from the saved draft, and
    // priority used to be read from the sprint combo's readonly *display text*
    // (`taskPriorityEl.value`) in the sibling tag-sync writer instead of its value
    // (`taskPriorityCombo.dataset.current`).
    const saveTaskDraft = () => {
      const st = ensureManualTaskState();
      st.title = taskTitleEl.value;
      st.description = taskDescEl.value;
      st.priority = taskPriorityCombo.dataset.current;
      st.type = taskTypeEl ? taskTypeEl.value : 'task';
      saveNewTaskDraft();
    };
    taskTitleEl.addEventListener('input', saveTaskDraft);
    taskDescEl.addEventListener('input', saveTaskDraft);
    taskPriorityCombo.addEventListener('sprint-combo:change', saveTaskDraft);
    if (taskTypeEl) taskTypeEl.addEventListener('change', saveTaskDraft);
  }

  // (C1242) Cmd/Ctrl+Enter → Preview, form phase only. Bound directly on title/desc (not
  // delegated on app/document) so it can never interfere with the tag input's / dependency
  // input's / sprint combo's own Enter handling — none of those check modifier keys or call
  // stopPropagation(). #new-task-confirm (preview phase) is deliberately not wired here — the
  // app-level Cmd/Ctrl+Enter listener further down already owns that combo for committing an
  // inline preview-card edit.
  for (const el of [taskTitleEl, taskDescEl]) {
    if (!el) continue;
    el.addEventListener('keydown', (e) => {
      if (!isSubmitShortcut(e)) return;
      e.preventDefault();
      const previewBtn = newTaskForm?.querySelector('#new-task-preview');
      if (previewBtn) previewBtn.click();
    });
  }

  // Clear task draft button
  const clearTaskDraftBtn = newTaskForm?.querySelector('#clear-task-draft');
  if (clearTaskDraftBtn) {
    clearTaskDraftBtn.addEventListener('click', () => {
      clearDraft(DRAFT_KEY_TASK);
      sessionStorage.removeItem(ACTIVE_NEW_TAB_KEY);
      state.manualTaskState = null;
      loadAndRender();
    });
  }

  // ── Tag type-ahead input ──
  const tagInputField = newTaskForm?.querySelector('#tag-input-field');
  const tagInputWrapper = newTaskForm?.querySelector('#tag-input-wrapper');
  const tagDropdown = newTaskForm?.querySelector('#tag-dropdown');
  if (tagInputField && tagInputWrapper && tagDropdown) {
    let selectedTags = (state.manualTaskState && state.manualTaskState.tags) || [];
    let highlightIndex = -1;

    // (C1245) Routed through the same single writer as saveTaskDraft above — was
    // previously its own inline saveDraft/clearDraft call that silently dropped
    // `type` and read the sprint combo's display text instead of its value.
    function syncTagsToState() {
      const st = ensureManualTaskState();
      st.tags = [...selectedTags];
      saveNewTaskDraft();
    }

    function renderChips() {
      tagInputWrapper.querySelectorAll('.tag-chip').forEach(c => c.remove());
      selectedTags.forEach(tag => {
        const chip = document.createElement('span');
        chip.className = 'tag-chip';
        chip.dataset.tag = tag;
        const desc = state.tagDescriptions.get(tag);
        if (desc) chip.title = desc;
        chip.innerHTML = escapeAttr(tag) + '<button class="tag-chip-remove" data-tag="' + escapeAttr(tag) + '">&times;</button>';
        tagInputWrapper.insertBefore(chip, tagInputField);
      });
    }

    function addTag(tag) {
      tag = tag.trim();
      if (!tag) return;
      if (selectedTags.some(t => t.toLowerCase() === tag.toLowerCase())) return;
      selectedTags.push(tag);
      renderChips();
      tagInputField.value = '';
      hideDropdown();
      syncTagsToState();
    }

    function removeTag(tag) {
      selectedTags = selectedTags.filter(t => t !== tag);
      if (state.manualTaskState) state.manualTaskState.tags = selectedTags;
      renderChips();
      syncTagsToState();
    }

    function hideDropdown() {
      tagDropdown.style.display = 'none';
      tagDropdown.innerHTML = '';
      highlightIndex = -1;
    }

    function showSuggestions(val) {
      val = val.trim().toLowerCase();
      if (!val) { hideDropdown(); return; }
      // (C1517) Name matches (prefix, unchanged) rank above description-only substring
      // matches — see filterTagOptions in tag-match.js.
      const matches = filterTagOptions(allTags, val, { selected: selectedTags, descriptions: state.tagDescriptions, nameMatch: 'prefix' });
      const isNew = val && !allTags.some(t => t.toLowerCase() === val) && !selectedTags.some(s => s.toLowerCase() === val);
      if (matches.length === 0 && !isNew) { hideDropdown(); return; }
      let html = '';
      if (isNew) {
        html += `<div class="tag-dropdown-item" data-action="create" data-value="${escapeAttr(tagInputField.value.trim())}">Create: <strong>${escapeAttr(tagInputField.value.trim())}</strong></div>`;
      }
      matches.forEach(t => {
        const desc = tagDescription(t, state.tagDescriptions);
        html += `<div class="tag-dropdown-item" data-value="${escapeAttr(t)}">${escapeAttr(t)}${desc ? `<small class="tag-dropdown-desc">${escapeAttr(desc)}</small>` : ''}</div>`;
      });
      tagDropdown.innerHTML = html;
      tagDropdown.style.display = 'block';
      highlightIndex = -1;
    }

    async function createTagWithDescription(name) {
      tagDropdown.innerHTML = `
        <div class="tag-create-form">
          <span class="tag-create-name">${escapeAttr(name)}</span>
          <input type="text" class="tag-create-desc" placeholder="Short description (required)">
          <button class="tag-create-confirm" disabled>Add</button>
          <span class="tag-create-error" style="display:none;color:var(--color-error,#f38ba8);font-size:0.8em"></span>
        </div>`;
      tagDropdown.style.display = 'block';
      const descInput = tagDropdown.querySelector('.tag-create-desc');
      const confirmBtn = tagDropdown.querySelector('.tag-create-confirm');
      const errorEl = tagDropdown.querySelector('.tag-create-error');
      descInput.focus();
      descInput.addEventListener('input', () => {
        confirmBtn.disabled = !descInput.value.trim();
      });
      async function confirmCreate() {
        const description = descInput.value.trim();
        if (!description) return;
        confirmBtn.disabled = true;
        confirmBtn.textContent = '...';
        errorEl.style.display = 'none';
        try {
          if (window.electronAPI?.api) {
            await window.electronAPI.api.tags.ensure(name, description);
          } else {
            // (C1392) Was header-less — see api-client.js _http() for why this matters in browser mode.
            const res = await fetch('./api/tags', { method: 'POST', headers: { 'Content-Type': 'application/json', ...projectHeader() }, body: JSON.stringify({ name, description }) });
            if (!res.ok) {
              const data = await res.json().catch(() => ({}));
              errorEl.textContent = data.error || 'Failed to register tag';
              errorEl.style.display = 'block';
              confirmBtn.disabled = false;
              confirmBtn.textContent = 'Add';
              return;
            }
          }
          state.tagDescriptions.set(name, description);
          addTag(name);
        } catch (err) {
          errorEl.textContent = err.message || 'Network error';
          errorEl.style.display = 'block';
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Add';
        }
      }
      descInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); confirmCreate(); }
        if (e.key === 'Escape') { e.preventDefault(); hideDropdown(); tagInputField.focus(); }
      });
      confirmBtn.addEventListener('mousedown', (e) => { e.preventDefault(); confirmCreate(); });
    }

    function updateHighlight() {
      const items = tagDropdown.querySelectorAll('.tag-dropdown-item');
      items.forEach((item, i) => item.classList.toggle('highlighted', i === highlightIndex));
    }

    tagInputField.addEventListener('input', () => showSuggestions(tagInputField.value));

    tagInputField.addEventListener('keydown', (e) => {
      const items = tagDropdown.querySelectorAll('.tag-dropdown-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (items.length) { highlightIndex = Math.min(highlightIndex + 1, items.length - 1); updateHighlight(); }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (items.length) { highlightIndex = Math.max(highlightIndex - 1, 0); updateHighlight(); }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (highlightIndex >= 0 && items[highlightIndex]) {
          const item = items[highlightIndex];
          if (item.dataset.action === 'create') {
            createTagWithDescription(item.dataset.value);
          } else {
            addTag(item.dataset.value);
          }
        } else if (tagInputField.value.trim()) {
          addTag(tagInputField.value);
        }
      } else if (e.key === ',') {
        e.preventDefault();
        if (tagInputField.value.trim()) addTag(tagInputField.value);
      } else if (e.key === 'Backspace' && !tagInputField.value) {
        if (selectedTags.length) removeTag(selectedTags[selectedTags.length - 1]);
      }
    });

    tagDropdown.addEventListener('mousedown', (e) => {
      const item = e.target.closest('.tag-dropdown-item');
      if (!item) return;
      e.preventDefault();
      if (item.dataset.action === 'create') {
        createTagWithDescription(item.dataset.value);
      } else {
        addTag(item.dataset.value);
      }
    });

    tagInputWrapper.addEventListener('click', (e) => {
      if (e.target.closest('.tag-chip-remove')) {
        removeTag(e.target.closest('.tag-chip-remove').dataset.tag);
        return;
      }
      tagInputField.focus();
    });

    tagInputField.addEventListener('blur', () => {
      setTimeout(() => {
        if (!tagDropdown.contains(document.activeElement)) hideDropdown();
      }, 150);
    });
  }

  // (C1258) Bind these three `app`-level delegates exactly once — `app` itself survives every
  // render (only its innerHTML is replaced), so re-running addEventListener here on every
  // loadAndRender() call was an unbounded listener leak. Delegation means they still work
  // against freshly-rendered preview cards with no rebinding needed.

  // handler is now a fallback guard and should never fire for preview cards.
  app.addEventListener('dblclick', (e) => {

    el.classList.remove('editing');
    delete el.dataset.editSnapshot;

      el.dataset.raw = el.innerText.trim();
      el.innerHTML = renderMarkdown(el.dataset.raw);
    }
  });

  app.addEventListener('keydown', (e) => {
    const el = e.target.closest('.preview-title.editing, .preview-desc.editing');
    if (!el) return;

    // Ctrl/Cmd+Enter: commit
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      el.blur();
      return;
    }
    // Enter on title: commit (single-line)
    if (e.key === 'Enter' && el.classList.contains('preview-title')) {
      e.preventDefault();
      el.blur();
      return;
    }
    // Escape: discard changes
    if (e.key === 'Escape') {
      el.contentEditable = 'false';
      el.classList.remove('editing');
      if (el.classList.contains('preview-desc') && el.dataset.raw !== undefined) {
        el.innerHTML = renderMarkdown(el.dataset.raw);
      } else if (el.dataset.editSnapshot !== undefined) {
        el.innerText = el.dataset.editSnapshot;
      }

  // above, alongside the Import menu it used to sit next to.

  // ── Chat card accept/reject/save/discard handlers (from chat-task-preview module) ──
  attachCardHandlers();

  // ── Breadcrumb navigation handlers ──
  // (TPT24) Breadcrumb bar still renders on the New Objective/New Task composer tabs (the
  // objective's own crumb, pushed by the yellow Create Subtasks button) — a click on it
  // must actually navigate out of the composer, not just mutate a stack the composer never
  // re-renders against. Same escape as exitSubtaskContextForTab(), not routed through it:
  // that helper is scoped to landing on 'board'/'backlog' and firing it here would also
  // fight the manual-subtask flow, which still reads the live stack top as parentTaskKey.
  // (TPT59) No `.breadcrumb-home` segment/handler — the top-nav Project Board tab already
  // exits any drill-down to root via exitSubtaskContextForTab().
  app.querySelectorAll('.breadcrumb-item[data-idx]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      state.subtaskStack = state.subtaskStack.slice(0, idx + 1);
      if (isNewSectionTab()) state.activeTab = 'board';
      loadAndRender({ scrollToTop: true });
    });
  });
  // (C1340) Expand the collapsed breadcrumb path in place — no navigation, so no
  // stack mutation; renderBreadcrumbs() re-collapses on its own once the stack
  // next shrinks.

    btn.addEventListener('click', () => {

      loadAndRender({ scrollToTop: false });
    });
  });
  // ── Parent detail pane handlers (C1461) ──

    });
  });
  // No navigation, no re-render — same reasoning as .breadcrumb-ellipsis above: toggle the
  // clamp class + label in place, and remember the flag so the next real render (a status
  // patch, a tab switch back) doesn't re-collapse it out from under the user.
  app.querySelectorAll('.parent-task-pane-toggle').forEach(btn => {
    btn.addEventListener('click', () => {

      setParentPaneExpanded(expanded);

    });
  });
  app.querySelectorAll('.btn-open-subtask-board').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();

      // button clickable until the re-render lands, so N clicks used to stack N crumbs.
      utils.pushSubtaskCrumb(state.subtaskStack, { taskKey: btn.dataset.taskKey, title: btn.dataset.taskTitle });
      state.activeTab = 'board';
      loadAndRender({ scrollToTop: true });
    });
  });

  // (showSplitModal()'s .btn-split-auto, task-board.js) via the shared
  // spawnSplitObjectiveTab() helper: seeded "Split <key> into subtasks." brief,
  // subtaskCtx + rehashIntent:'split', subtask-context banner. Was origin-linked
  // seedObjectiveFromTask(taskKey, {originTaskKey}) (TPT15) — that seeded the chat
  // with the task's own title+description but a single-task result silently
  // ADOPTED this objective's key instead of creating a child. Split mode always
  // creates children; the task body still reaches the planner via the server-side
  // <rehash-split> directive (claude-session.js), not duplicated into the box.
  app.querySelectorAll('.btn-create-subtasks').forEach(btn => {

  for (const taskId of state.newlyAssignedTasks) {

  }

  // site now — applySearchFilter()'s no-search branch used to call this too, a duplicate forced
  // layout pass over every .card/.preview-card on every single render.
  markTruncatedCards();

  // (C1427) This render just wired the Objective pane's .chat-container from scratch (composer-
  // header switcher, Import/History/console-toggle above, plus setupCardInteractions/
  // markTruncatedCards). Stamp it so a later window.TipTask.wireObjectivePane() call — the C1282
  // partial-repaint path, or the restore path's post-render safety net — sees it's already wired
  // and no-ops instead of double-binding.
  const _objChatContainer = app.querySelector('.chat-container');
  if (_objChatContainer) _objChatContainer.dataset.objWired = '1';

  initBulkActionBar((opts) => loadAndRender(opts), {
    onStartTaskSession: (task, agent) => startTaskSession(
      task.id,
      task.title,
      task.description || '',
      task.status,
      { agent },
    ),
    onFetchActiveSessions: async () => { await fetchActiveSessions(); updateClaudeButtons(); },
  });
  updateBulkActionBar();

  // Scroll policy — evaluated in priority order:
  //   1. Terminal overlay open → leave pendingRestoreContext intact, do nothing.
  //   2. Returning from terminal → restore to pre-open scroll + re-expand pinned card.
  //   3. Explicit navigation (options.scrollToTop or one-shot state.pendingScrollTop) → top.
  //   4. Default: preserve scroll across in-place data refreshes (status confirms, WS updates, etc.)
  //
  // DEFAULT IS PRESERVE. Scroll-to-top only happens on genuine navigation. This prevents
  // trailing debounced re-renders and status-confirm renders from jumping to top.
  const wantTop = options.scrollToTop || state.pendingScrollTop;
  state.pendingScrollTop = false; // always consume one-shot flag (prevent leakage to later renders)

  if (state.activeTerminal) {
    // overlay open — leave state.pendingRestoreContext intact for when the terminal closes

    const ctx = state.pendingRestoreContext;
    state.pendingRestoreContext = null;
    window.scrollTo(0, startScrollY);
    if (ctx.cardId && ctx.cardMode === 'pinned') {
      const cardToRestore = app.querySelector(`.card[data-id="${ctx.cardId}"]`);
      if (cardToRestore) {

    }

    window.scrollTo(0, 0);
  } else {
    // Default: preserve scroll position across data-refresh re-renders.
    window.scrollTo(0, startScrollY);
  }

  // Restore chain highlights after re-render
  if (state.chainHighlightedTaskId) {
    const savedId = state.chainHighlightedTaskId;
    const savedMode = state.chainHighlightMode; // (C1433/C1569) 'deps' | 'objective' | 'related'
    state.chainHighlightedTaskId = null;
    state.chainHighlightColorIndex--;
    if (savedMode === 'objective') applyObjectiveHighlight(savedId);
    else if (savedMode === 'related') applyRelatedHighlight(savedId);
    else applyChainHighlight(savedId);
  }

  if (document.getElementById('api-status-banner')) showApiStatusBanner('connected');
  stopOfflineRetry();
  // (C1427) Signals "the DOM this render built is fully wired" — chat-ui.js's restore IIFE
  // listens for this once to run its post-render wireObjectivePane() safety net against the
  // right (freshly rendered) subtree instead of a synchronous call against the old one.
  document.dispatchEvent(new Event('tiptask:rendered'));
  perfEnd(_larWire);
}


// ── To-Do drawer ──
function openTodoDrawer(task) {
  const drawer = document.getElementById('todo-drawer');
  if (!drawer) return;
  const tagsHtml = (task.tags || []).map(tag => {
    const desc = state.tagDescriptions.get(tag);
    return `<span class="tag-badge"${desc ? ` title="${escapeAttr(desc)}"` : ''}>${escapeAttr(tag)}</span>`;
  }).join('');
  const depsHtml = (task.dependencies || []).length
    ? `<div class="drawer-deps"><strong>Depends on:</strong> ${task.dependencies.map(d => escapeAttr(d)).join(', ')}</div>`
    : '';
  const statusOpts = statusNames().map(s =>
    `<option value="${s}"${s === task.status ? ' selected' : ''}>${statusLabel(s)}</option>`
  ).join('');
  drawer.innerHTML = `
    <button class="todo-drawer-close" aria-label="Close">&times;</button>
    <div class="drawer-id">${escapeAttr(task.id)}</div>
    <h2 class="drawer-title">${escapeAttr(task.title)}</h2>
    <div class="drawer-meta">
      <select class="drawer-status" style="--status-color:${statusColor(task.status)}">${statusOpts}</select>
      <span class="drawer-cat">${escapeAttr(task.category || '')}</span>
      <span class="drawer-sprint">${escapeAttr(groupTitle(task.priority ?? '?'))}</span>
    </div>
    ${tagsHtml ? `<div class="drawer-tags">${tagsHtml}</div>` : ''}
    <div class="drawer-desc">${renderMarkdown(task.description || '')}</div>
    ${depsHtml}`;
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');

  drawer.querySelector('.todo-drawer-close').addEventListener('click', closeTodoDrawer);
  drawer.querySelector('.drawer-status').addEventListener('change', async (e) => {
    const next = e.target.value;
    try {
      if (window.electronAPI?.api) {
        await window.electronAPI.api.tasks.update(task.id, { status: next });
      } else {
        // (C1392) Was header-less — see api-client.js _http() for why this matters in
        // browser mode.
        await fetch(`/api/tasks/${encodeURIComponent(task.id)}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json', ...projectHeader() },
          body: JSON.stringify({ status: next }),
        });
      }
      // (C1259) Was loadAndRender() (full board rebuild) + a full drawer re-render for
      // one status change. Patch the select's own color var, keep `task` (this drawer
      // instance's closure) in sync, and patch the underlying To-Do row directly —
      // mirrors the .todo-check handler above.
      task.status = next;
      e.target.style.setProperty('--status-color', statusColor(next));
      const row = app.querySelector(`.todo-item[data-task-id="${task.id}"]`);
      if (row) {
        row.className = `todo-item todo-item--${next}${row.classList.contains('agent-assigned') ? ' agent-assigned' : ''}`;
        row.dataset.statusRole = statusRoleToken(next);
        const cb = row.querySelector('.todo-check');
        if (cb) cb.checked = isCompleteName(next);
        const titleEl = row.querySelector('.todo-title');
        if (titleEl) titleEl.classList.toggle('done', isCompleteName(next));
      }
      state.taskStatusById.set(task.id, next);
    } catch (err) { showToast(t('common.error', { msg: err.message }), 'error'); }
  });
}

function closeTodoDrawer() {
  const drawer = document.getElementById('todo-drawer');
  if (!drawer) return;
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  state.todoDrawerTaskId = null;
}

let boardReconnectTimer = null;

// self-heal below (mirrors attention-ws.js's Electron-side onopen self-heal, C1057) only

// ── Green attention: newly assigned tasks ──

function applyNewlyAssigned(taskId) {
  state.newlyAssignedTasks.add(taskId);
  const card = app.querySelector(`.card[data-id="${taskId}"]`);
  if (card) card.classList.add('task-new-assigned');
  const prev = state.newlyAssignedTimers.get(taskId);
  if (prev) clearTimeout(prev);
  state.newlyAssignedTimers.set(taskId, setTimeout(() => clearNewAssignment(taskId), 10000));
}

function clearNewAssignment(taskId) {
  state.newlyAssignedTasks.delete(taskId);
  const t = state.newlyAssignedTimers.get(taskId);
  if (t) clearTimeout(t);
  state.newlyAssignedTimers.delete(taskId);
  const card = app.querySelector(`.card[data-id="${taskId}"]`);
  if (card) card.classList.remove('task-new-assigned');
}

document.addEventListener('tiptask:clear-new-assignment', (e) => {
  clearNewAssignment(e.detail.taskId);
});

document.addEventListener('click', (e) => {
  if (!state.chainHighlightedTaskId) return;
  if (!e.target.closest('.card')) clearChainHighlights();
});

function connectBoardWs() {
  if (boardWs && (boardWs.readyState === WebSocket.OPEN || boardWs.readyState === WebSocket.CONNECTING)) {
    return;
  }

  boardWs = new WebSocket(buildWsUrl('__board__'));

  boardWs.onopen = () => {
    // (C1356) Browser mode had no self-heal on reconnect — anything broadcast while the
    // socket was down (a completion, a task change) was silently missed forever, since
    // tasks-updated/task:updated are fire-and-forget with no replay. Electron's
    // attention-ws.js already does this on its own reconnect (C1057); this brings browser
    // mode to parity. Skipped on the very first open — init() already does an initial
    // loadAndRender() + fetchActiveSessions() of its own.
    if (!_boardWsHasConnectedOnce) { _boardWsHasConnectedOnce = true; return; }
    syncNavStatusesFromServer({ force: true });
    // (TPT58) Soft-stale, not a hard wipe — whatever was missed while the socket was down is
    // caught by the forceFresh render below (current key) and by each other entry's own
    // immediate background refetch on its next cache-hit render (storedAt zeroed).
    staleBoardTaskCache();
    loadAndRender({ forceFresh: true }).catch(() => {});
  };

    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }

    // Electron ever opens — connectBoardWs() itself is skipped there, see below) so an
    // auto-fired Re-Index toast looks identical regardless of trigger or transport.
    if (TipTask.taskBoard.handleKbWsMessage(msg)) return;
    // (TPT345) merge:* job frames + worktree-dirty-on-complete — browser mode only; Electron
    // dispatches these from attention-ws.js (connectBoardWs() is skipped there).
    if (handleMergeWsMessage(msg)) return;

    if (msg.type === 'config') {
      state.showAiStats = msg.showAiStats;
      if (msg.taskAgent) state.taskAgent = msg.taskAgent;
      if (msg.taskAgentLabel) state.taskAgentLabel = msg.taskAgentLabel;
      if (msg.agentLabels && typeof msg.agentLabels === 'object' && !Array.isArray(msg.agentLabels)) state.agentLabels = msg.agentLabels;
      if ('planApprovalCommand' in msg) state.planApprovalCommand = msg.planApprovalCommand;
      if (msg.supportsPlanMode !== undefined) state.supportsPlanMode = msg.supportsPlanMode;
      state.availableAgents = Array.isArray(msg.availableAgents) ? msg.availableAgents : [];
      if (Array.isArray(msg.agentStatuses)) state.agentStatuses = msg.agentStatuses;
      if (msg.deviceId) state.deviceId = msg.deviceId;
      if ('avatarUrl' in msg) state.currentUserAvatar = msg.avatarUrl || null;
      if ('projectName' in msg) state.projectName = msg.projectName || ''; // (C1137)

      state.currentUserId = msg.currentUserId ?? null;
      if (state.currentUserId !== _prevUserId && typeof loadAndRender === 'function') {

      }
      return;
    }

      // (C1178) Voice tab in the Settings modal — unscoped WS events from voice-model-manager.js
      // (see websocket.js:108-116), same broadcast() transport as the board's own messages.
      // (C1197) :deleted added so a window that didn't click Delete still repaints the row.
      handleVoiceModelMessage(msg);
      return;
    }

      // state.attentionSessions/attentionDetails bookkeeping identical across both transports,
      // and is now also the single OS-notification trigger for both. See src/client/attention-ws.js.
      TipTask.attentionWs.handleAttentionMessage(msg);
      return;
    }

      TipTask.attentionWs.handleAttentionMessage(msg);
      return;
    }
    if (msg.type === 'session-ended') {
      if (msg.taskId) {
        state.activeSessions.delete(msg.taskId);
        state.exitedSessions.delete(msg.taskId);
        TipTask.attentionState.clearAttention(msg.taskId, 'session-ended'); // (C1387)
        TipTask.attentionNotifications.forgetTaskAttention(msg.taskId);
        TipTask.notificationCenter.dismissNotification(msg.taskId); // (C1137) prompt resolved

        return;
      }

      // (C1259) applyTaskPatch() (task-card.js) — was ~90 lines duplicating
      // task-card.js's refreshCard()/regroupCardToSprint() field-by-field, including a
      // dead `.status-select` selector that never matched real card markup (board cards
      // only ever render `.card-status-select`) — that patch silently no-opped. One
      // shared implementation now; 'reload' still falls back to the debounced full
      // refresh for a card that's filtered/collapsed/paginated out, or whose target
      // tier isn't currently rendered.
      if (applyTaskPatch(t) === 'reload') {
        clearTimeout(boardRefreshTimer);
        // (C1258) applyTaskPatch() returns 'reload' whenever no .card[data-id] is in the DOM —
        // which is ALWAYS true while the user is in Create (no cards render there at all), not
        // just "filtered/collapsed/paginated out" as on the board. Unlike the tasks-updated
        // (2521) and task:created/tasks:finalized (2597) branches, this one had no section
        // guard — every task:updated event while composing scheduled a full innerHTML-wiping
        // loadAndRender() 300ms later, destroying in-progress compose state (caret, open
        // Embed/Import popovers, textarea height). The board cache's own fingerprint check
        // (see § Board task cache) already re-syncs it the moment the user returns to a
        // Tasks-section tab, so nothing is lost by skipping this while on Create.
        if (isTasksSectionTab()) {
          state.pendingRestoreContext = { scrollY: window.scrollY, cardId: state.selectedCardId, cardMode: state.expandedCardMode };
          boardRefreshTimer = setTimeout(() => loadAndRender({ forceFresh: true }), 300);
        }
        return;
      }

      // A status update can move a card out of the selected status facet. Keep the
      // incremental path as immediate as the checkbox filter path.
      applySearchFilter();

      // Cancel pending tasks-updated debounce (file watcher will fire ~500ms later)
      clearTimeout(boardRefreshTimer);
      return;
    }

    if (msg.type === 'task:deleted') {
      if (!msg.id) return;
      // (C1259) removeCardFromDom() (task-card.js) — was a local copy of the same
      // card+tier removal showDeleteConfirmModal() now also shares.
      removeCardFromDom(msg.id);
      // Clean stale selection
      if (state.selectedCardIds.has(msg.id)) {
        state.selectedCardIds.delete(msg.id);
        updateBulkActionBar();
      }
      clearTimeout(boardRefreshTimer);
      return;
    }

    if (msg.type === 'task:created' || msg.type === 'tasks:finalized') {
      clearTimeout(boardRefreshTimer);
      if (isDragging() || isDropInProgress() || app.querySelector('.card-desc.editing')) {
        _pendingBoardRefresh = true;
        return;
      }
      boardRefreshTimer = setTimeout(() => {
        if (state.activeTab !== 'board' && state.activeTab !== 'list' && state.activeTab !== 'todo' && state.activeTab !== 'backlog') return;
        state.pendingRestoreContext = { scrollY: window.scrollY, cardId: state.selectedCardId, cardMode: state.expandedCardMode };
        loadAndRender({ forceFresh: true });
      }, 300);
    }
  };

  boardWs.onclose = () => {
    boardWs = null;
    clearTimeout(boardReconnectTimer);
    boardReconnectTimer = setTimeout(connectBoardWs, 3000);
  };

  boardWs.onerror = () => {};
}

// Task edit modal — Escape key closes (non-blocking dirty-discard confirm, C1392). (TPT466) Not
// from inside the workspace's Agent Terminal pane: Esc belongs to the agent's PTY there, and a
// double Esc closes the workspace through the terminal's own key handler.
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (e.target?.closest?.('.task-modal-pane--terminal')) return;
  void requestCloseTaskEditModal();
});

// Lightweight DOM walk to apply/remove pending-sync class without full re-render
function applyPendingSyncClass() {
  const cards = app.querySelectorAll('.card[data-id]');
  for (const card of cards) {
    const id = card.dataset.id;
    if (state.pendingTaskIds.has(id)) {
      card.classList.add('pending-sync');
    } else {
      card.classList.remove('pending-sync');
    }
  }
}

// Wire api-status → corner banner (once; no loadAndRender on disconnect/reconnect)

// (C1389) Fetch one task through whichever transport this window uses — mirrors the
// electronAPI-vs-fetch branch hydrateSprints() already uses above, not api-client.js
// (that's task-board.js's own ES-module import, not reachable from this inline script).
async function _fetchTaskForHandoff(taskKey) {
  if (window.electronAPI?.api?.tasks?.get) {
    return window.electronAPI.api.tasks.get(taskKey);
  }
  const r = await fetch(`/api/tasks/${encodeURIComponent(taskKey)}`, { headers: projectHeader() });
  if (!r.ok) throw new Error(r.statusText || 'Failed to load task');
  return r.json();
}

// Web, IPC, and board handoffs seed Objective chat here. Carry originTaskKey so
// save can refine the source task. Return tabId only when a chat opened.
async function seedObjectiveFromTask(taskKey, { warning, originTaskKey, title, description } = {}) {
  let task = title !== undefined ? { title, description } : null;
  if (!task) {
    try {
      task = await _fetchTaskForHandoff(taskKey);
    } catch (err) {
      showToast(err.message || t('handoff.loadFailed', { taskKey }), 'error');
      return null;
    }
    if (!task) {
      showToast(t('handoff.taskNotFound', { taskKey }), 'error');
      return null;
    }
  }
  const seed = buildObjectiveSeed(task, taskKey);
  const tabId = spawnObjectiveTab(seed, { title: task.title || taskKey, originTaskKey: originTaskKey || null });
  if (!tabId) return null; // MAX_TABS hit — toast already shown by spawnObjectiveTab
  if (warning) {
    TipTask.notificationCenter?.pushNotification?.({
      tag: `handoff-${taskKey}`,
      title: t('handoff.notYourTaskTitle'),
      body: t('handoff.notYourTaskBody', { taskKey }),
    });
  }
  return tabId;
}

// Initial load
// (TPT12) Board-init one-shot activity fetch — see the call site in init() below. Fails
// open: any error (offline, a deployment predating these routes) just leaves chips absent
// until the next successful poll tick, same fail-soft contract as loadStatuses()/
// loadGroupLabel() above.
async function _loadInitialTaskActivity() {
  try {
    // (TPT12) Same ipc-first/fetch-fallback shape as fetchObjectiveTaskState() above — this
    // is a project-scoped read, so Electron must go through the per-window IPC backend, not
    // the HTTP proxy's process-global one (see main/ipc/api-router.js's own comment on
    // api:project.settings for why).
    let result;
    if (window.electronAPI?.api?.project?.notifications) {
      result = await window.electronAPI.api.project.notifications.list({ unreadOnly: true, limit: 200 });
    } else {
      const res = await fetch('./api/project/notifications?unread_only=true&limit=200', { headers: projectHeader() });
      result = res.ok ? await res.json() : null;
    }
    const activity = TipTask.taskActivity.reduceActivityRows(result?.notifications || []);
    TipTask.taskActivity.applyActivitySnapshot(activity);
    TipTask.taskActivity.syncActivityChips();
  } catch { /* next poll tick will catch up */ }
}

async function init() {
  TipTask.notifications.requestPermission();
  try {
    // (C1392) Was header-less — see api-client.js _http() for why this matters in browser mode.
    const r = await fetch('./api/agent-config', { headers: { 'Cache-Control': 'no-cache', ...projectHeader() } });
    if (r.ok) {
      const c = await r.json();
      if (c.taskAgent) state.taskAgent = c.taskAgent;
      if (c.taskAgentLabel) state.taskAgentLabel = c.taskAgentLabel;
      if (c.agentLabels && typeof c.agentLabels === 'object' && !Array.isArray(c.agentLabels)) state.agentLabels = c.agentLabels;
      if ('planApprovalCommand' in c) state.planApprovalCommand = c.planApprovalCommand;
      if (c.supportsPlanMode !== undefined) state.supportsPlanMode = c.supportsPlanMode;
      state.availableAgents = Array.isArray(c.availableAgents) ? c.availableAgents : [];
      if (Array.isArray(c.agentStatuses)) state.agentStatuses = c.agentStatuses;
      state.currentUserId = c.currentUserId ?? null;
    }
  } catch { /* board WS / terminal config will still populate later in browser mode */ }
  await ensureProjectMembers();
  // Set the UI locale before the first paint so the board renders localized.
  await applyProjectLanguage();
  // (C1187) Load this project's status registry before the first paint too — fail-soft,
  // never throws, so a statuses hiccup can't block board load.
  await loadStatuses();
  // (C1235) Same fail-soft contract as loadStatuses() — resolves the project's group noun
  // (Sprint/Batch/Bag/Jar/Group/Step) before the first paint so container titles aren't
  // wrong for one frame.
  await loadGroupLabel();
  // Restore saved filters (search/human/status/tags) before the first paint — needs the
  // status registry above so a stale saved status name can be dropped. Never writes.
  await applyProjectBoardFilters();
  await applyProjectDebugPerfLog();
  await applyProjectBrowserTools();
  // (C1200) force:true — this is the very first paint, nothing could be recording yet, and
  // deferring the first render would leave the board blank.
  await loadAndRender({ scrollToTop: true, force: true });
  // (TPT12) One-shot activity snapshot so cards carry the right chip immediately after a
  // reload, not only after the next ~30s poll diff. Fire-and-forget — first paint already
  // happened above, and this must never delay it. Always the silent first-ever application
  // (see task-activity.js's _hasBaseline) as long as it lands before any task-activity WS
  // frame does; if a WS frame somehow wins the race, applyActivitySnapshot's own idempotent
  // diffing still produces the correct end state, just with an extra frame having already
  // supplied the baseline.
  void _loadInitialTaskActivity();
  initSettingsModal();
  await fetchActiveSessions();
  updateClaudeButtons();
  // (C1057) Electron subscribes to the narrow, project-scoped __attention__ channel instead
  // of the full board WS — see src/client/attention-ws.js and ai/architecture/tt-electron-app.md
  // for why (the board WS's singleton `config` message and KB session-sync/pushAll are unsafe
  // to enable per-window). The Task App server IS running in Electron (main.js forks it) —
  // only the board's own WS connection is skipped here.
  if (window.electronAPI?.api) {
    TipTask.attentionWs.connectAttentionWs();
  } else {
    connectBoardWs();
  }
  // (C1389) ?objectiveTask=<taskKey> handoff — after the board itself is up so a slow
  // task fetch/seed can't delay first paint. Strip the param via replaceState (preserving
  // ?projectPath=, same rewrite technique as the onProjectChanged handler below) so a
  // reload doesn't re-seed the same tab.
  if (_objectiveTaskKey) {
    const params = new URLSearchParams(location.search);
    params.delete('objectiveTask');
    params.delete('objectivePlan'); // (C1559) same strip-before-reload discipline
    const qs = params.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
    seedObjectiveFromTask(_objectiveTaskKey, { originTaskKey: _objectivePlan ? _objectiveTaskKey : null });
  }
}
init();

  if (window.electronAPI.onOpenObjective) {
    window.electronAPI.onOpenObjective(({ taskKey, warning, originTaskKey, title, description }) => {
      if (taskKey) seedObjectiveFromTask(taskKey, { warning, originTaskKey, title, description });
    });
  }
  // (C1559) Web→Task App handoff, the other 2 /start-task dispatch branches — pushed by
  // main.js's focusAndStartTask(). `children` (an is_objective task's fetched child list,
  // [] for a regular task) is picked from HERE, not server-side — this renderer alone
  // holds the live board status map pickFirstStartableChild()/isDepsBlocked() needs.
  if (window.electronAPI.onStartTask) {
    window.electronAPI.onStartTask(({ taskKey, children }) => {
      if (!taskKey) return;
      const list = Array.isArray(children) ? children : [];
      const target = list.length > 0 ? window.TipTask.taskCard.pickFirstStartableChild(list) : null;
      if (list.length > 0 && !target) {
        // Every child is already closed/in-progress/blocked/not-mine — nothing to start.
        showToast(t('handoff.noStartableChild', { taskKey }), 'info');
        return;
      }
      window.TipTask.taskCard.startTaskById(target ? target.id : taskKey);
    });
  }
  _btnCurrent.addEventListener('click', () => {
    if (!_pendingProjectDir || _btnCurrent.disabled) return;
    window.electronAPI.openProject(_pendingProjectDir, 'current');
    _projModal.style.display = 'none';
    _pendingProjectDir = null;
  });

  _btnNew.addEventListener('click', () => {
    if (!_pendingProjectDir) return;
    window.electronAPI.openProject(_pendingProjectDir, 'new');
    _projModal.style.display = 'none';
    _pendingProjectDir = null;
  });

  _btnCancel.addEventListener('click', () => {
    _projModal.style.display = 'none';
    _pendingProjectDir = null;
  });

  window.electronAPI.onProjectChanged(async (dir, name) => {
    // (TPT310) Electron re-sends project:changed on every window load and on rename — resetAgentQuota()
    // ignores the same project, so only a real switch to another one refetches plan usage.
    resetAgentQuota(dir);
    document.title = dir ? `${name || _projBasename(dir)} — TipΔTask` : 'TipΔTask — TODO';
    // Sync projectPath into location.search so buildWsUrl (ws-client.js) and all
    // location.search-based projectPath readers pick it up after an in-place adoption
    // (setup-window or target='current' rebind) where no full loadURL is issued.
    // Without this, session.projectPath stays empty and claude-agent falls back to
    // config.PROJECT_ROOT (the .app bundle path in packaged builds) for --mcp-config.
    try {
      if (dir && new URLSearchParams(location.search).get('projectPath') !== dir) {
        history.replaceState(null, '', location.pathname + '?projectPath=' + encodeURIComponent(dir));
      }
    } catch {}
    // (C1057) Rebind the attention socket to the (possibly new) projectPath now in
    // location.search — buildWsUrl() reads it fresh on connect, so close+reconnect is enough.
    if (window.electronAPI?.api) {
      TipTask.attentionWs.closeAttentionWs();
      TipTask.attentionWs.connectAttentionWs();
    }
    if (!dir || dir === _lastLoadedProject) return;
    _lastLoadedProject = dir;
    // Reset per-project sprint/tier state so stale data from the previous project doesn't bleed through.
    state.sprints = [];
    state.collapsedTiers.clear();
    state.expandedTiers.clear();
    state.extraStepsLoaded = 0;
    state.allStepsLoaded = false;
    _searchFullWindowActive = false;
    // (C1462) Project A's objective tabs point at parentKeys that don't exist in project B —
    // must not render/navigate across a project switch.
    state.objectiveTabs = [];
    // (TPT181) The chat model selector's provider list is per-project too (AVAILABLE_AGENTS,
    // PI_CONFIGURED_MODELS) and was never reset here — project B would keep rendering project A's
    // list until the refresh TTL. The loadAndRender() at the end of this handler re-fetches.
    chatUI.invalidateObjectiveProviders();
    clearBoardTaskCache();
    // (C1187) Drop back to the legacy status seed BEFORE the switch below, so no frame
    // renders the previous project's custom status names against the new project's tasks.
    resetStatuses();
    // (C1235) Same reasoning — don't let project A's group noun leak into project B's
    // first frame while loadGroupLabel() below is still in flight.
    resetGroupLabel();
    // IPC mode: backend already switched in main process via bindWindowToProject.
    // Browser mode: call project-switch endpoint.
    if (!window.electronAPI?.api) {
      try { await fetch(`/api/project-switch?path=${encodeURIComponent(dir)}`); } catch {}
    }
    // Language must be applied before render (strings bake into the HTML);
    // theme is CSS-only so it can follow after. Status registry too — fetched fresh for
    // the new project before the first render.
    await applyProjectLanguage();
    await loadStatuses();
    await loadGroupLabel();
    // Restore the NEW project's own saved filters (search/human/status/tags) — without this,
    // the previous project's in-memory state.statusFilter/activeTagFilters/etc. leak straight
    // into this project's board (project switch never used to reset them).
    await applyProjectBoardFilters();
  await applyProjectDebugPerfLog();
  await applyProjectBrowserTools();
    // (C1200) force:true — a project switch already tears down #app for the new project's data;
    // a mic recording against the OLD project's #chat-input has nothing meaningful left to finish
    // into.
    await loadAndRender({ scrollToTop: true, force: true });
    // Apply the per-project theme after the new backend is active.
    applyProjectTheme();
  });

  // ── Create/Open chooser (replaces first-run onboarding) ──────────────────
  // (C1388) Both Get Started's button clicks and the Project menu's 'open' action
  // now share one implementation — see openOrCreateProject() / _showChooseModal()
  // above. The old two-static-button wiring is gone with the markup that backed it.

  window.electronAPI.onProjectMenu(async (action) => {
    if (action === 'choose') { _showChooseModal({ mode: 'getStarted' }); return; }
    // (C1388 §B) Renamed from a bare "open a folder" action — this now IS the
    // unified Open/Create entry point (menu label: "Open / Create Project…").
    if (action === 'open') { await openOrCreateProject(); return; }
    // (C1486) No 'close' branch here anymore — Cmd+W's menu item and the title-bar X both
    // call window.close() directly in main.js now, so both routes hit the shared
    // attachCloseGuard()/confirmWindowClose() native dialog. The prior C1485 renderer guard
    // (hard-block toast on live sessions, silent closeCurrentProject() otherwise) is removed;
    // do not reintroduce a project:menu 'close' handler or a closeCurrentProject() call here.
    if (action === 'rename') {
      const current = await window.electronAPI.getCurrentProject();
      if (!current) { showToast(t('project.noProjectLoaded'), 'error'); return; }
      const currentName = document.title.split(' — ')[0] || '';
      const next = await _showProjectRenameModal(currentName);
      if (next == null) return;
      const trimmed = next.trim();
      if (!trimmed || trimmed === currentName) return;
      const res = await window.electronAPI.renameProject(trimmed);
      if (!res?.ok) showToast(t('project.renameFailed', { msg: res?.error || t('project.unknownError') }), 'error');
      return;
    }
    if (action === 'settings') { openSettingsModal(); return; }
    if (action === 'merge-branches') { openMergeBranchesModal(); return; }
    if (action === 'sync-kb') { syncKb(); return; }
    if (action === 'reindex-kb') { reindexKb(); return; }
  });

  // Close modals on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (_projModal.style.display === 'flex') {
        _projModal.style.display = 'none';
        _pendingProjectDir = null;
      }
      if (_chooseModal?.style.display === 'flex') {
        _chooseModal.style.display = 'none';
      }
    }
  });

}

</script>
</body>
</html>
