<title>TipΔTask</title>
<style>
  /* C1006: STATIC splash. No @keyframes / animation / transition rules — the
     main process is blocked for most of this window's lifetime, and a startup
     animation is explicitly not wanted. Keep it that way.
     C1171: background is the accent artwork (splash-bg.webp, derived from
     ai/examples/splash/SPLASH-accent-14B8A6.png, aspect ~2.4353:1). The window
     size in main.js matches that ratio exactly, so background-size:cover shows
     the whole image with no crop. All text sits in the image's left paper
     region (roughly the left half, above the ground hatching) — never widen
     .splash-main or raise its vertical extent without re-checking that region.
     C1380: .splash-main is a centered column (align-items/text-align:center,
     width:50% + padding:0 6% -> content box spans 6%-44%, optical center 25%)
     so the wordmark/status/copyright share one vertical centerline while
     staying clear of the artwork past ~51%. Do NOT switch to margin:0 auto —
     that centers on the whole window (~53%) and lands text on the artwork.
     C1172: main.js's computeSplashBounds() now sizes the window as a fraction
     (40%, clamped 560-960px) of the launch display's work area instead of a
     fixed 640x263, so this layout must scale PURELY proportionally (vw/em) —
     no fixed px sizes below the root font-size — or text stops growing once
     the window passes whatever px value it was tuned at. */
  :root {
    --splash-paper: #f1f1ef;   /* left paper region of splash-bg.webp */
    --splash-ink: #1e1e2e;     /* was --splash-bg in the pre-C1171 dark palette */
    --splash-muted: #5c5f77;
    --splash-accent: #14b8a6;   /* app-icon teal (scripts/gen-icon.js) */
    --splash-border: rgba(30, 30, 46, 0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* C1172: root font-size scales with viewport width (window is ratio-locked, so vw alone
     tracks both dimensions together) — every text/spacing rule below is expressed in em/vw
     off this, so the whole splash scales as one unit across the 560-960px window range.
     The clamp() floor/ceiling are safety rails for sizes outside that range, not the
     active scaling mechanism. */
  html { font-size: clamp(8px, 2.05vw, 20px); }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;        /* vertical-center the text column in the window */
    justify-content: flex-start;
    background: var(--splash-paper) url('splash-bg.webp') center / cover no-repeat;
    color: var(--splash-ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    border: 1px solid var(--splash-border);
    border-radius: 10px;
    overflow: hidden;
    cursor: default;
    -webkit-user-select: none;
    user-select: none;
  }
  .splash-main {
    display: flex;
    flex-direction: column;
    align-items: center;   /* C1380: was flex-start — centers logo/status/copyright as one column */
    justify-content: center;
    width: 50%;            /* C1380: was 42% width + padding-left:6% (left-aligned column) —
                               50% + symmetric padding below gives a content box spanning
                               6%-44%, optical center 25%, still clear of the artwork at ~51% */
    padding: 0 6%;
    text-align: center;    /* C1380: was left */
    gap: 0.8vw;            /* C1172: was a fixed 0.5rem — vw keeps spacing proportional too */
  }
  /* TPT290: the website's TipΔTask lockup as inline SVG outlines (no font file, no
     fetch). "Tip"/"Task" are Literata ExtraBold (wght 800, opsz 28) glyph outlines,
     the Δ is the same solid slanted insignia path as scripts/gen-icon.js DELTA_PATH,
     laid out exactly as website/public/css/marketing.css .tt-wordmark/.tt-brand-delta
     (Δ at 1.35em, 0.06em side margins, -0.05em baseline shift, -0.01em tracking).
     viewBox units are font units (1000 = 1em of the wordmark), so the SVG width
     below is the lockup's advance in em of .splash-logo's own font-size. */
  .splash-logo {
    font-size: 2.15em;     /* C1172: em off the vw-scaled root — was clamp(1.5rem,6.5vw,2.75rem) */
    line-height: 0;
    color: var(--splash-ink);
  }
  .splash-logo svg { display: block; width: 5.372em; height: auto; }
  .splash-logo-delta { fill: var(--splash-accent); }
  .splash-status {
    font-size: 0.72em;     /* C1172: was clamp(0.6875rem,2.2vw,0.9rem) */
    color: var(--splash-muted);
    letter-spacing: 0.04em;
  }
  .splash-copyright {
    margin-top: 0.9vw;     /* C1172: was a fixed 0.5rem */
    font-size: 0.63em;     /* C1172: was clamp(0.625rem,1.9vw,0.8rem) */
    color: var(--splash-muted);
  }
</style>
